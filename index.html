<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{height:100%;margin:0;}
:root{
  --bg:#F1F2F8; --surface:#FFFFFF; --surface-2:#F7F8FC; --border:#E3E5F0;
  --text:#171A24; --text-muted:#666C82; --text-faint:#9599AC;
  --sidebar-bg:#FFFFFF; --sidebar-bg-2:#ECEDFC; --sidebar-text:#666C82; --sidebar-active:#171A24;
  --accent:#4C56E8; --accent-strong:#3A43D1; --accent-soft:#ECEDFC; --accent-contrast:#FFFFFF;
  --gold:#C9A24B; --gold-ink:#2A2410; --gold-card:#181A26; --gold-card-2:#22243A;
  --success:#178A54; --success-bg:#E4F6EC; --warning:#B4680A; --warning-bg:#FDF0DD;
  --danger:#C22A2A; --danger-bg:#FCE9E9; --info:#2457C9; --info-bg:#E8EFFD;
  --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.12);
  --shadow-lg:0 20px 60px -20px rgba(10,12,30,.35);
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
    --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
    --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
    --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
    --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
    --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
    --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
  --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
  --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
  --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
  --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
  --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
  --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);}
h1,h2,h3,h4,.disp{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{min-height:100%;}
.icon{width:18px;height:18px;flex:none;display:block;}
.icon-sm{width:15px;height:15px;}
.icon-lg{width:26px;height:26px;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.12s ease;white-space:nowrap;font-family:var(--font-body);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:var(--accent-contrast);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-soft{background:var(--accent-soft);color:var(--accent);}
.btn-soft:hover{filter:brightness(0.97);}
.btn-gold{background:var(--gold);color:var(--gold-ink);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:default;}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.12s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);}
.checkline input{width:16px;height:16px;padding:0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.01em;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-warning{background:var(--warning-bg);color:var(--warning);}
.pill-danger{background:var(--danger-bg);color:var(--danger);}
.pill-info{background:var(--info-bg);color:var(--info);}
.pill-muted{background:var(--surface-2);color:var(--text-muted);}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);flex:none;font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.toast{position:fixed;left:50%;top:16px;bottom:auto;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:900;max-width:90vw;text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(10,11,20,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:800;padding:0;}
@media(min-width:720px){.overlay{align-items:center;padding:24px;}}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;gap:16px;}
@media(min-width:720px){.modal{border-radius:20px;}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-close{background:var(--surface-2);border:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.grid2{grid-template-columns:1fr;}}
.hairline{height:1px;background:var(--border);border:none;margin:2px 0;}
/* ---- gate screens ---- */
.gate-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:
  radial-gradient(1000px 500px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--gold), transparent 35%),
  var(--bg);}
:root[data-theme="dark"] .gate-wrap, @media (prefers-color-scheme:dark){.gate-wrap{opacity:1;}}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 28px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:16px;flex:none;object-fit:contain;padding:4px;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:17px;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;font-weight:700;}
.gate-title{font-size:23px;font-weight:800;margin:2px 0 6px;}
.gate-desc{color:var(--text-muted);font-size:14px;line-height:1.5;margin-bottom:22px;}
.choice-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:15px 16px;cursor:pointer;transition:.12s;margin-bottom:10px;}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.choice-ic{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
.choice-txt-t{font-weight:700;font-size:14.5px;}
.choice-txt-d{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
.back-link:hover{color:var(--text);}
/* ---- admin layout ---- */
.admin-shell{display:flex;min-height:100%;}
.sidebar{width:240px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;gap:4px;border-right:1px solid var(--border);}
.sidebar .brand{padding:2px 8px 20px;margin:0;}
.sidebar .brand-name{color:var(--sidebar-active);}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sidebar-text);transition:.12s;}
.nav-item:hover{background:var(--sidebar-bg-2);color:var(--sidebar-active);}
.nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;padding:16px 12px 6px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;font-size:12.5px;}
.sidebar-user b{color:var(--sidebar-active);display:block;font-size:12.5px;}
.sidebar-user span{color:var(--text-faint);font-size:11.5px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;}
.topbar-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;}
.topbar-title{font-size:21px;font-weight:800;font-family:var(--font-display);}
.content{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
.mobile-nav{display:none;}
@media(max-width:880px){
  .sidebar{display:none;}
  .mobile-nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(to right,transparent,black 14px,black calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,black 14px,black calc(100% - 28px),transparent);}
  .mobile-nav::-webkit-scrollbar{display:none;}
  .mobile-nav .nav-item{flex:none;color:var(--sidebar-text);white-space:nowrap;font-size:12.5px;padding:8px 10px;scroll-snap-align:start;}
  .mobile-nav .nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);}
  .topbar{padding:14px 16px;}
  .content{padding:16px 14px 50px;}
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{padding:18px 20px;display:flex;flex-direction:column;gap:8px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;}
.stat-num{font-size:30px;font-weight:800;font-family:var(--font-display);}
.stat-ic{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.section-title{font-size:16px;font-weight:800;font-family:var(--font-display);}
.section-title small{display:block;font-size:12px;color:var(--text-muted);font-weight:500;margin-top:2px;font-family:var(--font-body);}
.expiring-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.exp-card{background:var(--warning-bg);border:1px solid transparent;border-radius:12px;padding:11px 13px;}
.exp-card.urgent{background:var(--danger-bg);}
.exp-name{font-weight:700;font-size:13.5px;}
.exp-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
.scan-box{padding:22px;text-align:center;}
.scan-zone{border:2px dashed var(--border);border-radius:16px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);position:relative;overflow:hidden;}
.scan-zone.ok{border-color:var(--success);background:var(--success-bg);}
.scan-zone.bad{border-color:var(--danger);background:var(--danger-bg);}
.scan-ic-wrap{width:58px;height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.scan-title{font-weight:700;font-size:15px;}
.scan-sub{font-size:12.5px;color:var(--text-muted);}
video.scan-video{width:100%;max-width:280px;border-radius:12px;margin-top:6px;}
.result-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface-2);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:0 12px 10px;}
td{padding:12px;border-top:1px solid var(--border);vertical-align:middle;}
.table-wrap{overflow-x:auto;}
tr td:first-child,tr th:first-child{padding-left:0;}
tr td:last-child,tr th:last-child{padding-right:0;text-align:right;}
.search-row{display:flex;gap:10px;}
.client-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;}
.client-row:hover{background:var(--surface-2);}
.client-row:last-child{border-bottom:none;}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.plan-card{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);background:var(--surface);}
.plan-card.gold{background:linear-gradient(155deg,var(--gold-card),var(--gold-card-2));border-color:transparent;color:#EDE2C4;}
.plan-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-faint);}
.plan-card.gold .plan-eyebrow{color:var(--gold);}
.plan-name{font-family:var(--font-display);font-weight:700;font-size:15.5px;}
.plan-price{font-family:var(--font-display);font-weight:800;font-size:28px;}
.plan-price span{font-size:13px;font-weight:600;color:var(--text-muted);}
.plan-card.gold .plan-price span{color:#B9AE8E;}
.plan-meta{font-size:12px;color:var(--text-muted);}
.plan-card.gold .plan-meta{color:#B9AE8E;}
.qr-wrap{background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;}
.qr-wrap img,.qr-wrap canvas{border-radius:8px;}
.code-chip{font-family:var(--font-mono);font-weight:700;letter-spacing:.04em;background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px;text-align:center;font-size:17px;}
.modal-wide{max-width:640px;}
.detail-grid{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start;min-width:0;}
.detail-grid>div{min-width:0;}
@media(max-width:640px){.detail-grid{grid-template-columns:1fr;}}
.info-list{display:flex;flex-direction:column;gap:12px;}
.info-row .info-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:2px;}
.info-row .info-value{font-size:14px;}
.member-card{border:1.5px solid var(--gold);border-radius:var(--radius-l);padding:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.print-card{display:none;}
@media print{
  body *{visibility:hidden;}
  .print-card,.print-card *{visibility:visible;}
  .print-card{display:flex;position:fixed;top:1cm;left:50%;transform:translateX(-50%);width:9cm;height:5cm;box-sizing:border-box;border:1.5px solid var(--gold);border-radius:4mm;background:#fff;padding:4mm;gap:4mm;align-items:center;}
  .print-card .pc-left{flex:none;width:28mm;height:28mm;display:flex;align-items:center;justify-content:center;}
  .print-card .qr-wrap{padding:0;background:#fff;width:100%;height:100%;}
  .print-card .qr-wrap canvas,.print-card .qr-wrap img{width:26mm;height:26mm;}
  .print-card .pc-right{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1.5mm;}
  .print-card .mc-brand{font-size:9px;}
  .print-card .pc-name{font-family:var(--font-display);font-weight:800;font-size:15px;color:#171A24;}
  .print-card .pc-plan{font-size:10.5px;color:#444;line-height:1.4;}
  .print-card .pc-code{font-size:14px;padding:1.5mm 3mm;align-self:flex-start;}
}
.member-card .qr-wrap{padding:10px;} .member-card .mc-brand{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);} .member-card .mc-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-top:4px;} .member-card .mc-name{font-family:var(--font-display);font-weight:700;font-size:15px;} .member-card .mc-plan{font-size:12px;color:var(--text-muted);line-height:1.5;} .member-card .mc-code{color:var(--gold);border-color:var(--gold);}
.member-card .mc-footer{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;}
.bar{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.bar.hi{background:var(--accent);}
.empty-state{padding:36px 16px;text-align:center;color:var(--text-muted);}
.empty-state .icon-lg{margin:0 auto 10px;color:var(--text-faint);}
.settings-block{display:flex;flex-direction:column;gap:14px;}
.team-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border-radius:12px;}
.news-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
/* ---- client portal ---- */
.client-shell{min-height:100%;background:var(--bg);}
.client-top{background:var(--sidebar-bg);color:var(--sidebar-active);padding:18px 20px 46px;border-bottom:1px solid var(--border);}
.client-header-row{display:flex;align-items:center;justify-content:space-between;}
.client-body{max-width:520px;margin:-30px auto 0;padding:0 16px 50px;display:flex;flex-direction:column;gap:16px;}
.sub-card{border-radius:20px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
.sub-card.tone-success{background:linear-gradient(150deg,#1B8F5D,#106040);}
.sub-card.tone-warning{background:linear-gradient(150deg,#C97F14,#8C5203);}
.sub-card.tone-danger{background:linear-gradient(150deg,#C0362F,#7E1F1B);}
.sub-card.tone-muted{background:linear-gradient(150deg,#3A3E52,#22243380);}
.sub-card.tone-gold{background:linear-gradient(150deg,var(--gold-card),var(--gold-card-2));}
.sub-top{display:flex;justify-content:space-between;align-items:flex-start;}
.sub-days{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;margin-top:10px;}

function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}); }
function money(n,cur){ n=Number(n||0); return n.toLocaleString('ro-RO',{maximumFractionDigits:0})+' '+(cur||'MDL'); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+Number(days||0)); return d.toISOString().slice(0,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
async function sha256(text){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text||'')); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function setPath(obj, path, value){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(o==null) return; } o[parts[parts.length-1]]=value; }
function daysLeft(validTo){ if(!validTo) return null; const today=new Date(); today.setHours(0,0,0,0); const vt=new Date(validTo+'T00:00:00'); return Math.round((vt-today)/86400000); }
function payMethodLabel(m){ return {cash:'Numerar',card:'Card',transfer:'Transfer bancar'}[m]||m; }

function browserSave(filename, data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(e){ return false; }
}
const refSettings=()=>db.doc('settings/config');

const colPay=()=>db.collection('payments');

/* ============ RENDER SCHEDULING ============ */
let rafPending=false;
function scheduleRender(){ if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; render(); }); }
function showToast(msg){ state.toast=msg; scheduleRender(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{ state.toast=null; scheduleRender(); },2600); }
async function logMod(operation, details){ try{ await colMod().add({date:new Date().toISOString(), operation, actor:'Administrator', details:details||''}); }catch(e){} }

/* ============ INIT & SUBSCRIPTIONS ============ */
async function init(){
  render();
  try{
    if(typeof FIREBASE_CONFIG==='undefined' || !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) throw new Error('missing-config');
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){ db = null; console.error('Firebase init failed:', e); }
  state.dbOk = !!db;
  if(!db){ state.ready=true; scheduleRender(); return; }
  subscribeAll();
}
function subscribeAll(){
  refSettings().onSnapshot(snap=>{
    state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    state.ready=true; scheduleRender();
  }, ()=>{ state.ready=true; scheduleRender(); });
  colTypes().orderBy('order','asc').onSnapshot(snap=>{ state.types=snap.docs.map(d=>Object.assign({id:d.id}, d.data())); scheduleRender(); }, ()=>{});
  colClients().onSnapshot(snap=>{ state.clients=snap.docs.map(d=>Object.assign({id:d.id}, d.data())); scheduleRender(); }, ()=>{});

/* ============ DOMAIN HELPERS ============ */
function typeById(id){ return state.types.find(t=>t.id===id); }
function subStatus(c){
  const sub=c.subscription;
  if(c.paused) return {label:'Suspendat', tone:'warning'};
  if(!sub || !sub.validTo) return {label:'Fără abonament', tone:'muted'};
  const dl=daysLeft(sub.validTo);
  const due=(sub.totalDue||0)-(sub.totalPaid||0);
  if(dl<0) return {label:'Expirat', tone:'danger'};
  if(due>0.5) return {label:'Neachitat', tone:'danger'};
  const warn = (state.settings && state.settings.warnDays!=null) ? state.settings.warnDays : 5;
  if(dl<=warn) return {label: dl===0?'Expiră azi':('Expiră în '+dl+' '+(dl===1?'zi':'zile')), tone:'warning'};
  return {label:'Valabil', tone:'success'};
}
function toneForResult(r){
  if(r==='permis') return 'success';
  if(r==='necunoscut'||r==='neachitat'||r==='expirat') return 'danger';
  if(r==='suspendat'||r==='orar'||r==='orar_sala'||r==='inchis'||r==='prea_devreme') return 'warning';
  if(r==='neinceput') return 'info';
  return 'muted';
}
function inTimeWindow(date, fromStr, toStr){
  const [fh,fm]=fromStr.split(':').map(Number); const [th,tm]=toStr.split(':').map(Number);
  const mins=date.getHours()*60+date.getMinutes(); const f=fh*60+fm, t=th*60+tm;
  if(f<=t) return mins>=f && mins<=t; return mins>=f || mins<=t;
}
function gymScheduleFor(date, s){ s=s||DEFAULT_SETTINGS; const day=date.getDay(); const openDays=s.openDays||DEFAULT_SETTINGS.openDays; const closedToday = (openDays && openDays[day]===false) || (s.closedDates||[]).includes(todayStr()); const isSaturday = day===6; const from = (isSaturday && s.saturdayDifferent) ? (s.saturdayOpenHour||DEFAULT_SETTINGS.saturdayOpenHour) : (s.openHour||DEFAULT_SETTINGS.openHour); const to = (isSaturday && s.saturdayDifferent) ? (s.saturdayCloseHour||DEFAULT_SETTINGS.saturdayCloseHour) : (s.closeHour||DEFAULT_SETTINGS.closeHour); return {closedToday, from, to}; } function generateUniqueCode(){
  for(let i=0;i<25;i++){ const n=Math.floor(1000+Math.random()*9000); const code='GYM-'+n; if(!state.clients.some(c=>c.code===code)) return code; }
  return 'GYM-'+String(Date.now()).slice(-4);
}
function formatGymCode(v){ v=(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.slice(0,3)==='GYM') return 'GYM-'+v.slice(3); return v; } async function verifyAccess(rawCode){
  if(!db) return;
  const code=(rawCode||'').trim().toUpperCase();
  if(!code) return;
  const client=state.clients.find(c=>c.code===code);
  const now=new Date();
  const gs=gymScheduleFor(now, state.settings); let result='permis', message='Acces permis';
  if(!client){ result='necunoscut'; message='Cod QR necunoscut'; }
  else if(client.paused){ result='suspendat'; message='Acces suspendat'; } else if(gs.closedToday){ result='inchis'; message='Sala este închisă în această zi.'; } else if(!inTimeWindow(now, gs.from, gs.to)){ result='orar_sala'; message='Sala este deschisă între '+gs.from+' și '+gs.to+'.'; }
  else{
    const sub=client.subscription||{};
    if(sub.validFrom && sub.validFrom>todayStr()){ result='neinceput'; message='Abonamentul începe pe '+fmtDate(sub.validFrom); }
    else{
      const dl = sub.validTo? daysLeft(sub.validTo) : null;
      const due=(sub.totalDue||0)-(sub.totalPaid||0);
      if(dl!==null && dl<0){ result='expirat'; message='Abonament expirat'; }
      else if(due>0.5){ result='neachitat'; message='Abonament neachitat'; }
      else{
        const type=typeById(sub.typeId);
        const af=(type&&type.accessFrom)||sub.accessFrom, at=(type&&type.accessTo)||sub.accessTo;
        if(af && at && !inTimeWindow(now,af,at)){ result='orar'; message='Acces permis doar între '+af+' și '+at; }
        else{
          const mm=(state.settings&&state.settings.minMinutesBetweenEntries)||0;
          if(mm && client.lastEntryAt){
            const diffMin=(now-new Date(client.lastEntryAt))/60000;
            if(diffMin<mm){ result='prea_devreme'; message='Prea devreme — mai așteaptă '+Math.ceil(mm-diffMin)+' min'; }
          }
        }
      }
    }
  }
  try{
    await colLog().add({clientId: client?client.id:null, clientName: client?client.name:'Cod necunoscut', code, timestamp: now.toISOString(), result, message});
    if(client && result==='permis'){ await colClients().doc(client.id).update({lastEntryAt: now.toISOString()}); }
  }catch(e){}
  state.lastResult={client, result, message, code}; state.scanInput='';
  scheduleRender();
}

async function replaceLostCard(id){ const c=state.clients.find(x=>x.id===id); if(!c) return; if(!confirm('Sigur înlocuiești cardul acestui client? Codul vechi ('+c.code+') nu va mai funcționa după ce salvezi.')) return; const newCode=generateUniqueCode(); try{ await colClients().doc(id).update({code:newCode}); await logMod('Card înlocuit (pierdut)', c.name+' · cod nou '+newCode); openModal('clientDetail',{id}); showToast('Card nou generat: '+newCode); } catch(e){ showToast('Eroare la înlocuirea cardului.'); } } function readImageResized(file, maxSize, quality){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onerror=()=>reject(new Error('read-error')); reader.onload=()=>{ const img=new Image(); img.onerror=()=>reject(new Error('image-error')); img.onload=()=>{ let w=img.width, h=img.height; const scale=Math.min(1, maxSize/Math.max(w,h)); w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale)); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); if(!ctx){ reject(new Error('no-ctx')); return; } ctx.drawImage(img,0,0,w,h); resolve(cv.toDataURL('image/jpeg', quality)); }; img.src=reader.result; }; reader.readAsDataURL(file); }); } async function uploadClientPhoto(id, file){ const c=state.clients.find(x=>x.id===id); if(!c) return; try{ const dataUri=await readImageResized(file, 320, 0.62); await colClients().doc(id).update({photoDataUri:dataUri}); await logMod('Fotografie client actualizată', c.name); openModal('clientDetail',{id}); showToast('Fotografia a fost salvată.'); }catch(e){ showToast('Eroare la încărcarea fotografiei.'); } } function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function buildCardCanvas(c){
  const sub=c.subscription||{};
  const gymName=((state.settings&&state.settings.gymName)||'Fitness Park').toUpperCase();
  const W=560, H=1000;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  if(!ctx) return null;
  ctx.fillStyle='#12131C'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#C9A24B'; ctx.lineWidth=5; roundRectPath(ctx,14,14,W-28,H-28,26); ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#C9A24B'; ctx.font='700 21px Sora, sans-serif'; ctx.fillText(gymName, W/2, 90);
  ctx.fillStyle='#9599AC'; ctx.font='700 13px "Public Sans", sans-serif'; ctx.fillText('CARD DE MEMBRU', W/2, 116);
  ctx.fillStyle='#FFFFFF'; ctx.font='700 30px Sora, sans-serif'; ctx.fillText(c.name, W/2, 172);
  const qrEl=document.querySelector('.member-card [data-qr="'+(window.CSS&&CSS.escape?CSS.escape(c.code):c.code)+'"]');
  const qrSrc = qrEl ? (qrEl.querySelector('canvas')||qrEl.querySelector('img')) : null;
  const qrSize=240, qrX=(W-qrSize)/2, qrY=205;
  ctx.fillStyle='#fff'; roundRectPath(ctx,qrX-14,qrY-14,qrSize+28,qrSize+28,14); ctx.fill();
  if(qrSrc){ try{ ctx.drawImage(qrSrc, qrX, qrY, qrSize, qrSize); }catch(e){} }
  ctx.fillStyle='#EDE2C4'; ctx.font='600 18px "Public Sans", sans-serif'; ctx.fillText(sub.typeName||'—', W/2, qrY+qrSize+55);
  ctx.fillStyle='#B9AE8E'; ctx.font='400 14px "Public Sans", sans-serif'; ctx.fillText(fmtDate(sub.validFrom)+' — '+fmtDate(sub.validTo), W/2, qrY+qrSize+80);
  ctx.fillStyle='#9599AC'; ctx.font='700 12px "Public Sans", sans-serif'; ctx.fillText('COD MEMBRU · VERIFICARE MANUALĂ', W/2, qrY+qrSize+120);
  ctx.fillStyle='#C9A24B'; ctx.font='700 24px "JetBrains Mono", monospace'; ctx.fillText(c.code, W/2, qrY+qrSize+154);
  ctx.fillStyle='#666C82'; ctx.font='400 13px "Public Sans", sans-serif'; ctx.fillText('Prezintă QR-ul sau codul la fiecare vizită.', W/2, H-40);
  return cv;
}

async function changePassword(){
  const f=state.pwForm||{};
  const user=firebase.auth().currentUser;
  if(!user || !user.email){ state.pwErr='Nu ești autentificat cu un cont de email.'; scheduleRender(); return; }
  if(!f.current){ state.pwErr='Introdu parola curentă.'; scheduleRender(); return; }
  if(!f.next||f.next.length<6){ state.pwErr='Parola nouă trebuie să aibă minim 6 caractere.'; scheduleRender(); return; }
  if(f.next!==f.confirm){ state.pwErr='Parolele nu coincid.'; scheduleRender(); return; }
  try{
    const cred=firebase.auth.EmailAuthProvider.credential(user.email, f.current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(f.next);
    state.pwForm={}; state.pwErr=''; await logMod('Parolă schimbată', user.email); showToast('Parola a fost schimbată.');
  }catch(e){
    if(e && (e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')){ state.pwErr='Parola curentă este greșită.'; }
    else{ state.pwErr='Eroare la schimbarea parolei.'; }
  }
  scheduleRender();
}
async function addTeam(){
  const f=state.teamForm||{};
  const email=(f.email||'').trim().toLowerCase();
  if(!email||!email.includes('@')){ showToast('Introdu un e-mail valid.'); return; }
  const pass=f.password||'';
  if(!pass||pass.length<6){ showToast('Parola inițială trebuie să aibă minim 6 caractere.'); return; }
  const existing=((state.settings&&state.settings.team)||[]); const hasOwner=existing.some(m=>m.role==='owner'); if(!(state.adminRole==='owner'||(!hasOwner&&state.adminRole==='admin'))){ showToast('Doar proprietarul poate gestiona echipa.'); return; }
  if(existing.some(m=>(m.email||'').toLowerCase()===email)){ showToast('Acest email are deja acces.'); return; }
  let secondaryApp=null; let reused=false;
  try{
    secondaryApp=firebase.initializeApp(firebase.app().options, 'teamAdd'+Date.now());
    await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
    await secondaryApp.delete();
  }catch(e){
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(_e){} }
    if(e && e.code==='auth/email-already-in-use'){ reused=true; }
    else if(e && e.code==='auth/weak-password'){ showToast('Parola trebuie să aibă minim 6 caractere.'); return; }
    else{ showToast('Eroare la crearea contului.'); return; }
  }
  const team=existing.slice(); team.push({email, role:f.role||'reception'});
  try{ await refSettings().set(Object.assign({}, state.settings||DEFAULT_SETTINGS, {team})); state.teamForm={}; await logMod('Acces echipă adăugat', email); showToast(reused? 'Acces redat — acest email avea deja un cont Firebase; colegul intră cu parola lui veche, nu cu cea introdusă acum.' : 'Cont creat — colegul poate intra cu acest email și parola primită.'); }
  catch(e){ showToast('Eroare la salvarea accesului.'); }
  scheduleRender();
}

     + '<div class="client-tabs">'
       + '<div class="client-tab'+(tab==='sub'?' active':'')+'" data-action="client-tab" data-tab="sub">Abonamentul meu</div>'
       + '<div class="client-tab'+(tab==='news'?' active':'')+'" data-action="client-tab" data-tab="news">Noutăți &amp; reguli</div>'
       + '<div class="client-tab'+(tab==='history'?' active':'')+'" data-action="client-tab" data-tab="history">Istoricul meu</div></div>'
     + (tab==='sub'? clientTabSub(c) : tab==='news'? clientTabNews() : clientTabHistory(myLog))
   + '</div></div>';
}
function clientTabSub(c){
  const sub=c.subscription||{}; const due=(sub.totalDue||0)-(sub.totalPaid||0);
  return '<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;">'
   + '<div class="qr-wrap"><div data-qr="'+esc(c.code)+'"></div></div>'
   + '<div class="code-chip">'+esc(c.code)+'</div>'
   + '<div class="small muted center">Arată acest cod la recepție pentru acces.</div><hr class="hairline">'
   + '<div class="flex justify-between small"><span class="muted">Preț abonament</span><span class="mono">'+money(sub.price,sub.currency)+'</span></div>'
   + '<div class="flex justify-between small"><span class="muted">Achitat</span><span class="mono">'+money(sub.totalPaid,sub.currency)+'</span></div>'
   + (due>0.5? ('<div class="flex justify-between small"><span class="muted">Rest de achitat</span><span class="mono" style="color:var(--danger);font-weight:700;">'+money(due,sub.currency)+'</span></div>') : '')
   + (c.phone? ('<div class="flex justify-between small"><span class="muted">Telefon</span><span class="mono">'+esc(c.phone)+'</span></div>') : '')
   + '</div>';
}
function clientTabNews(){
  const text=(state.settings&&state.settings.newsText)||'';
  return '<div class="card" style="padding:20px;"><div class="flex items-center gap8" style="margin-bottom:10px;">'+icon('news')+'<b>Noutăți &amp; reguli</b></div><div class="news-preview">'+esc(text).replace(/\n/g,'<br>')+'</div></div>';
}
function clientTabHistory(log){
  return '<div class="card" style="padding:10px 16px 4px;">'+(log.length? log.map(logRowHtml).join('') : '<div class="empty-state small">Nicio intrare înregistrată încă.</div>')+'</div>';
}

/* ============ MODAL DISPATCH ============ */
function openModal(type, seed){ state.modal={type}; state.form=seed||{}; state.formErr=''; scheduleRender(); }
function closeModal(){ state.modal=null; state.form={}; state.formErr=''; scheduleRender(); }
function renderModal(){
  const t=state.modal.type;
  if(t==='newClient') return modalNewClient();
  if(t==='clientDetail') return modalClientDetail();
  if(t==='editClient') return modalEditClient();
  if(t==='renew') return modalRenew(); if(t==='editSub') return modalEditSub();
  if(t==='editType') return modalEditType();
  return '';
}

/* ============ TOP-LEVEL RENDER ============ */
function render(){
  const root=document.getElementById('app');
  if(!root) return;
  const active=document.activeElement;
  let selKey=null, selStart=null, selEnd=null;
  if(active && root.contains(active)){
    const bindPath = active.getAttribute && active.getAttribute('data-bind');
    if(bindPath) selKey='[data-bind="'+bindPath.replace(/"/g,'\\"')+'"]';
    else if(active.id) selKey='#'+active.id;
    if('selectionStart' in active){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  }
  let html='';
  if(!state.ready){ html=renderLoading(); }
  else if(state.screen==='landing'){ html=renderLanding(); }
  else if(state.screen==='admin-gate'){ html=renderAdminGate(); }
  else if(state.screen==='client-gate'){ html=renderClientGate(); }
  else if(state.screen==='admin' && state.adminUnlocked){ html=renderAdminShell(); }
  else if(state.screen==='client' && state.clientSession){ html=renderClientPortal(); }
  else{ state.screen='landing'; html=renderLanding(); }
  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
  root.innerHTML=html;
  bindEvents(root);
  afterRenderHooks();
  if(selKey){ try{ const el=root.querySelector(selKey); if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } } }catch(e){} }
}
function afterRenderHooks(){
  document.querySelectorAll('[data-qr]').forEach(el=>{
    const text=el.getAttribute('data-qr'); el.innerHTML='';
    try{ new QRCode(el, {text, width:168, height:168, correctLevel:QRCode.CorrectLevel.M, colorDark:'#12131C', colorLight:'#ffffff'}); }catch(e){}
  });
  if(state.cameraOn && cameraStream){ const video=document.getElementById('scanVideo'); if(video && !video.srcObject) video.srcObject=cameraStream; }
}

/* ============ EVENTS ============ */
function bindEvents(root){
  root.querySelectorAll('[data-action]').forEach(el=>{ el.addEventListener('click', ()=>onAction(el)); }); root.querySelectorAll('[data-gymcode]').forEach(el=>{ el.addEventListener('input', ()=>{ const f=formatGymCode(el.value); if(f!==el.value) el.value=f; }); }); root.querySelectorAll('[data-numeric]').forEach(el=>{ el.addEventListener('input', ()=>{ let f=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,''); const firstDot=f.indexOf('.'); if(firstDot!==-1) f=f.slice(0,firstDot+1)+f.slice(firstDot+1).replace(/\./g,''); if(f!==el.value) el.value=f; }); }); root.querySelectorAll('[data-photo-upload]').forEach(el=>{ el.addEventListener('change', ()=>{ const id=el.getAttribute('data-photo-upload'); const file=el.files&&el.files[0]; if(file) uploadClientPhoto(id, file); }); });
  root.querySelectorAll('.modal').forEach(m=>m.addEventListener('click', e=>e.stopPropagation()));
  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key=el.getAttribute('data-nav');
      if(state.adminRole==='reception' && key!=='reception') return; if(key==='reports' && state.adminRole!=='owner') return;
      if(key==='settings' && !state.settingsDraft) state.settingsDraft=draftFromSettings(state.settings);
      state.adminSection=key; state.modal=null; scheduleRender();
    });
  });
  root.querySelectorAll('[data-bind]').forEach(el=>{
    const path=el.getAttribute('data-bind');
    const ev=(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='time')?'change':'input';
    el.addEventListener(ev, ()=>{
      const val = el.type==='checkbox'? el.checked : el.value;
      setPath(state, path, val);
      if(path==='form.typeId'){ if(state.modal&&state.modal.type==='newClient') applyTypeDefaultsNew(); if(state.modal&&state.modal.type==='renew') applyTypeDefaultsRenew(); }
      scheduleRender();
    });
  });
  root.querySelectorAll('[data-enter]').forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const a=el.getAttribute('data-enter'); const btn=root.querySelector('[data-action="'+a+'"]'); if(btn) btn.click(); } });
  });
}
function onAction(el){
  const a=el.getAttribute('data-action'); const id=el.getAttribute('data-id');
  switch(a){
    case 'go-admin': state.formErr=''; state.screen='admin-gate'; break;
    case 'go-client': state.formErr=''; state.screen='client-gate'; stopCamera(); break;
    case 'back-landing': state.screen='landing'; state.formErr=''; stopCamera(); break;
    case 'admin-login-submit': adminLoginSubmit(); return;
    case 'admin-claim-submit': adminClaimSubmit(); return;
    case 'admin-setup-submit': adminSetupSubmit(); return;
    case 'client-login-submit': clientLoginSubmit(); return;
    case 'admin-lock': state.adminUnlocked=false; state.adminRole=null; state.screen='admin-gate'; state.modal=null; lockAdminSession(); break;
    case 'client-logout': state.clientSession=null; state.screen='landing'; break;
    case 'open-new-client': openNewClient(el.getAttribute('data-type')||null); return;
    case 'open-client-detail': openModal('clientDetail', {id}); return;
    case 'open-renew': openRenew(id); return; case 'open-edit-sub': openEditSub(id); return;
    case 'open-edit-client': openEditClient(id); return;
    case 'toggle-pause-client': togglePauseClient(id); return;
    case 'delete-client': if(confirm('Sigur ștergi acest client? Acțiunea nu poate fi anulată.')) deleteClient(id); return;
    case 'print-card': printCard(id); return; case 'replace-lost-card': replaceLostCard(id); return;
    case 'download-card': downloadCardForPhone(id); return;
    case 'share-card': shareCard(id); return;
    case 'close-modal': closeModal(); return;
    case 'save-new-client': saveNewClient(); return;
    case 'save-renew': saveRenew(); return; case 'save-edit-sub': saveEditSub(); return;
    case 'save-edit-client': saveEditClient(); return;
    case 'open-new-type': openNewType(); return;
    case 'open-edit-type': openEditType(id); return;
    case 'save-type': saveType(); return;
    case 'delete-type': if(confirm('Ștergi acest tip de abonament din catalog?')) deleteType(id); return;
    case 'verify-scan': { const v=document.getElementById('scanInput'); verifyAccess(v?v.value:''); return; }
    case 'toggle-camera-reception': toggleCamera('scanInput'); return;
    case 'toggle-camera-client': toggleCamera('clientCode'); return;
    case 'export-csv': exportCSV(el.getAttribute('data-kind')); return; case 'clear-payments': if(confirm('Sigur ștergi tot istoricul încasărilor? Acțiunea nu poate fi anulată.')) clearPayments(); return; case 'clear-modlog': if(confirm('Sigur ștergi tot istoricul modificărilor? Acțiunea nu poate fi anulată.')) clearModLog(); return; case 'clear-accesslog': if(confirm('Sigur ștergi tot istoricul accesului? Acțiunea nu poate fi anulată.')) clearAccessLog(); return;
    case 'save-settings-general': saveSettingsGeneral(); return;
    case 'save-settings-name': saveSettingsName(); return;
    case 'save-settings-news': saveSettingsNews(); return;
    case 'change-password': changePassword(); return;
    case 'add-team': addTeam(); return;
    case 'remove-team': removeTeam(Number(el.getAttribute('data-idx'))); return;
    case 'client-tab': state.clientTab=el.getAttribute('data-tab'); break;
  }
  scheduleRender();
}
async function adminLoginSubmit(){
  const ve=document.getElementById('adminEmail'), vp=document.getElementById('adminPass');
  const email=(ve?ve.value:'').trim().toLowerCase(); const pass=vp?vp.value:'';
  if(!email||!pass){ state.formErr='Introdu email și parolă.'; scheduleRender(); return; }
  state.formErr='';
  try{ await firebase.auth().signInWithEmailAndPassword(email, pass); }
  catch(e){ state.formErr='Email sau parolă greșită.'; scheduleRender(); return; }
  const team=(state.settings&&state.settings.team)||[];
  const member=team.find(m=>(m.email||'').toLowerCase()===email);
  if(!member){
    try{ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); }catch(e){}
    state.formErr='Acest cont nu (mai) are acces la panou.';
    scheduleRender(); return;
  }
  state.adminUnlocked=true; state.adminRole=member.role||'admin'; state.screen='admin'; state.formErr=''; state.adminSection='reception';
  scheduleRender();
}
async function adminClaimSubmit(){
  const ve=document.getElementById('adminEmail'), vp=document.getElementById('adminPass');
  const email=(ve?ve.value:'').trim().toLowerCase(); const pass=vp?vp.value:'';
  if(!email||!pass){ state.formErr='Introdu email și parolă.'; scheduleRender(); return; }
  const team=(state.settings&&state.settings.team)||[];
  const member=team.find(m=>(m.email||'').toLowerCase()===email);
  if(!member){ state.formErr='Acest email nu are acces. Cere administratorului să te adauge în Echipă.'; scheduleRender(); return; }
  if(pass.length<6){ state.formErr='Parola trebuie să aibă minim 6 caractere.'; scheduleRender(); return; }
  try{ await firebase.auth().createUserWithEmailAndPassword(email, pass); }
  catch(e){
    if(e && e.code==='auth/email-already-in-use'){ state.formErr='Acest cont există deja — folosește „Intră în panou" cu parola ta.'; }
    else if(e && e.code==='auth/weak-password'){ state.formErr='Parola trebuie să aibă minim 6 caractere.'; }
    else{ state.formErr='Eroare la crearea contului.'; }
    scheduleRender(); return;
  }
  state.adminUnlocked=true; state.adminRole=member.role||'admin'; state.screen='admin'; state.formErr='';
  state.adminSection='reception';
  showToast('Cont creat. Ai acces la panou.');
  scheduleRender();
}
async function adminSetupSubmit(){
  const ve=document.getElementById('setupEmail'), v1=document.getElementById('setupPass1'), v2=document.getElementById('setupPass2');
  const email=(ve?ve.value:'').trim().toLowerCase(); const p1=v1?v1.value:'', p2=v2?v2.value:'';
  if(!email||!email.includes('@')){ state.formErr='Introdu un email valid.'; scheduleRender(); return; }
  if(!p1||p1.length<6){ state.formErr='Parola trebuie să aibă minim 6 caractere.'; scheduleRender(); return; }
  if(p1!==p2){ state.formErr='Parolele nu coincid.'; scheduleRender(); return; }
  try{
    await firebase.auth().createUserWithEmailAndPassword(email, p1);
    await refSettings().set(Object.assign({}, DEFAULT_SETTINGS, state.settings||{}, {team:[{email, role:'owner'}]}));
    state.adminUnlocked=true; state.adminRole='owner'; state.screen='admin'; state.formErr=''; state.adminSection='reception';
    showToast('Panoul de administrare e gata.');
  }catch(e){
    if(e && e.code==='auth/email-already-in-use'){ state.formErr='Există deja un cont cu acest email.'; }
    else if(e && e.code==='auth/weak-password'){ state.formErr='Parola trebuie să aibă minim 6 caractere.'; }
    else{ state.formErr='Eroare la salvare. Încearcă din nou.'; }
  }
  scheduleRender();
}
function lockAdminSession(){ try{ firebase.auth().signOut().then(()=>firebase.auth().signInAnonymously()).catch(()=>{}); }catch(e){} }
function clientLoginSubmit(){
  const v=document.getElementById('clientCode'); const code=(v?v.value:'').trim().toUpperCase();
  if(!code){ state.formErr='Introdu codul de membru.'; scheduleRender(); return; }
  const c=state.clients.find(x=>x.code===code);
  if(!c){ state.formErr='Codul nu a fost găsit. Verifică-l pe cardul tău.'; scheduleRender(); return; }
  state.clientSession=c.id; state.screen='client'; state.formErr=''; state.clientTab='sub'; stopCamera();
  scheduleRender();
}

/* ============ CAMERA SCANNING ============ */
async function toggleCamera(targetInputId){
  if(state.cameraOn){ stopCamera(); scheduleRender(); return; }
  state.cameraOn=true; state.cameraTarget=targetInputId; scheduleRender();
  try{ cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ state.cameraOn=false; showToast('Camera nu este disponibilă aici. Folosește codul manual.'); scheduleRender(); return; }
  setTimeout(()=>{
    const video=document.getElementById('scanVideo');
    if(!video){ stopCamera(); return; }
    video.srcObject=cameraStream;
    const canvas=document.getElementById('scanCanvas'); const ctx=canvas.getContext('2d');
    function tick(){
      if(!state.cameraOn) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth||320; canvas.height=video.videoHeight||240;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const res = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
        if(res && res.data){
          const code=res.data.trim().toUpperCase();
          const target=state.cameraTarget; stopCamera();
          if(target==='scanInput'){ verifyAccess(code); }
          else{
            const c=state.clients.find(x=>x.code===code);
            if(c){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; state.formErr=''; }
            else{ state.formErr='Cod necunoscut.'; }
            scheduleRender();
          }
          return;
        }
      }
      cameraRAF=requestAnimationFrame(tick);
    }
    cameraRAF=requestAnimationFrame(tick);
  }, 30);
}
function stopCamera(){
  state.cameraOn=false;
  if(cameraRAF){ cancelAnimationFrame(cameraRAF); cameraRAF=null; }
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
}

/* ============ BOOT ============ */
init();
</script>
