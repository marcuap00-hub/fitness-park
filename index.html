<title>Fitness Park</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
html,body{height:100%;margin:0;}
:root{
  --bg:#F1F2F8; --surface:#FFFFFF; --surface-2:#F7F8FC; --border:#E3E5F0;
  --text:#171A24; --text-muted:#666C82; --text-faint:#9599AC;
  --sidebar-bg:#FFFFFF; --sidebar-bg-2:#ECEDFC; --sidebar-text:#666C82; --sidebar-active:#171A24;
  --accent:#4C56E8; --accent-strong:#3A43D1; --accent-soft:#ECEDFC; --accent-contrast:#FFFFFF;
  --gold:#C9A24B; --gold-ink:#2A2410; --gold-card:#181A26; --gold-card-2:#22243A;
  --success:#178A54; --success-bg:#E4F6EC; --warning:#B4680A; --warning-bg:#FDF0DD;
  --danger:#C22A2A; --danger-bg:#FCE9E9; --info:#2457C9; --info-bg:#E8EFFD;
  --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.12);
  --shadow-lg:0 20px 60px -20px rgba(10,12,30,.35);
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
    --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
    --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
    --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
    --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
    --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
    --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
  --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
  --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
  --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
  --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
  --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
  --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);}
h1,h2,h3,h4,.disp{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{min-height:100%;}
.icon{width:18px;height:18px;flex:none;display:block;}
.icon-sm{width:15px;height:15px;}
.icon-lg{width:26px;height:26px;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.12s ease;white-space:normal;text-align:center;line-height:1.3;min-width:0;font-family:var(--font-body);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:var(--accent-contrast);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-soft{background:var(--accent-soft);color:var(--accent);}
.btn-soft:hover{filter:brightness(0.97);}
.btn-gold{background:var(--gold);color:var(--gold-ink);}
.btn-exclusiv{background:#C7C2E8;color:#211F2E;}
.btn-unlimited{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF);color:#171307;font-weight:700;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:default;}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.12s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.gate-card label.field{margin-bottom:14px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);}
.checkline input{width:16px;height:16px;padding:0;}
.addon-check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:14px;}
.addon-check input{width:20px;height:20px;padding:0;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.01em;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-warning{background:var(--warning-bg);color:var(--warning);}
.pill-danger{background:var(--danger-bg);color:var(--danger);}
.pill-info{background:var(--info-bg);color:var(--info);}
.pill-muted{background:var(--surface-2);color:var(--text-muted);}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);flex:none;font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.toast{position:fixed;left:50%;top:16px;bottom:auto;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:900;max-width:90vw;text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(10,11,20,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:800;padding:0;}
@media(min-width:720px){.overlay{align-items:center;padding:24px;}}
.modal{background:var(--surface);width:100%;max-width:580px;max-height:95vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;gap:20px;}
@media(min-width:720px){.modal{border-radius:20px;}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-close{background:var(--surface-2);border:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.grid2{grid-template-columns:1fr;}}
.grid3-birth{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;}
@media(max-width:380px){.grid3-birth{grid-template-columns:1fr;}}
.hairline{height:1px;background:var(--border);border:none;margin:2px 0;}
/* ---- gate screens ---- */
.gate-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:
  radial-gradient(1000px 500px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--gold), transparent 35%),
  var(--bg);}
:root[data-theme="dark"] .gate-wrap, @media (prefers-color-scheme:dark){.gate-wrap{opacity:1;}}
/* ---- public homepage (follows the light/dark theme) ---- */
.hp{--hp-bg:#F4F5FA;--hp-bg-rgb:244,245,250;--hp-bg2:#EBEDF6;--hp-card:#FFFFFF;--hp-card-soft:#FFFFFF;--hp-line:rgba(20,22,40,.10);--hp-line2:rgba(20,22,40,.18);--hp-text:#12141F;--hp-muted:#5A5F74;--hp-lead:#3B3F52;--hp-faint:#8A8FA3;
  --hp-accent:#3A34E0;--hp-accent-2:#4B45F0;--hp-lav:#4640E6;--hp-deep:#1616B0;--hp-chip:rgba(20,22,40,.06);--hp-ghost:rgba(20,22,40,.25);--hp-shadow:0 24px 60px -30px rgba(20,22,60,.35);
  --hp-gold-bg:linear-gradient(160deg,#FFF4D6,#FFFFFF 65%);--hp-gold-line:rgba(201,162,75,.45);--hp-gold-k:#9A7420;
  background:var(--hp-bg);color:var(--hp-text);min-height:100vh;font-family:var(--font-body);overflow-x:hidden;}
:root[data-theme="dark"] .hp{--hp-bg:#0B0D14;--hp-bg-rgb:11,13,20;--hp-bg2:#10131C;--hp-card:#141824;--hp-card-soft:rgba(255,255,255,.015);--hp-line:rgba(255,255,255,.09);--hp-line2:rgba(255,255,255,.22);--hp-text:#F1F2F8;--hp-muted:#A3A8BC;--hp-lead:#CDD0DD;--hp-faint:#6E7389;
  --hp-lav:#8E93FF;--hp-chip:rgba(255,255,255,.07);--hp-ghost:rgba(255,255,255,.28);--hp-shadow:0 30px 80px -30px rgba(0,0,0,.8);--hp-gold-bg:linear-gradient(160deg,#1D1A10,#141824 60%);--hp-gold-line:rgba(217,182,94,.35);--hp-gold-k:#E6C469;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hp{--hp-bg:#0B0D14;--hp-bg-rgb:11,13,20;--hp-bg2:#10131C;--hp-card:#141824;--hp-card-soft:rgba(255,255,255,.015);--hp-line:rgba(255,255,255,.09);--hp-line2:rgba(255,255,255,.22);--hp-text:#F1F2F8;--hp-muted:#A3A8BC;--hp-lead:#CDD0DD;--hp-faint:#6E7389;
  --hp-lav:#8E93FF;--hp-chip:rgba(255,255,255,.07);--hp-ghost:rgba(255,255,255,.28);--hp-shadow:0 30px 80px -30px rgba(0,0,0,.8);--hp-gold-bg:linear-gradient(160deg,#1D1A10,#141824 60%);--hp-gold-line:rgba(217,182,94,.35);--hp-gold-k:#E6C469;} }
.hp a{color:inherit;text-decoration:none;}
.hp-wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
.hp-nav{position:sticky;top:0;z-index:30;background:rgba(var(--hp-bg-rgb),.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hp-line);}
.hp-nav .hp-wrap{display:flex;align-items:center;gap:24px;height:78px;}
.hp-logo{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--hp-text);cursor:pointer;padding:0;font:inherit;}
.hp-logo img{width:46px;height:46px;object-fit:contain;}
.hp-logo-t{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;}
.hp-logo-t span{color:var(--hp-lav);}
.hp-links{display:flex;gap:30px;margin:0 auto;}
.hp-links button{background:none;border:none;color:var(--hp-muted);font:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:6px 0;transition:color .15s;white-space:nowrap;}
.hp-logo-t{white-space:nowrap;}
@media(max-width:1180px){ .hp-links{display:none;} .hp-nav .hp-wrap{justify-content:space-between;} }
.hp-links button:hover{color:var(--hp-text);}
.hp-actions{display:flex;align-items:center;gap:10px;}
.hp-actions .modal-close{background:var(--hp-chip);color:var(--hp-muted);}
.hp-actions .hp-show-sm{display:none;}
.hp .lang-toggle{background:var(--hp-chip);}
.hp .lang-toggle span{color:var(--hp-muted);}
.hp .lang-toggle span.on{background:var(--hp-card);color:var(--hp-text);}
.hp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:999px;border:1px solid transparent;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap;}
.hp-btn:hover{transform:translateY(-1px);}
.hp-btn .icon{width:15px;height:15px;}
.hp-btn-primary{background:var(--hp-accent);color:#fff;box-shadow:0 12px 30px -12px rgba(58,52,224,.8);}
.hp-btn-primary:hover{background:var(--hp-accent-2);}
.hp-btn-ghost{background:transparent;color:var(--hp-text);border-color:var(--hp-ghost);}
.hp-btn-ghost:hover{border-color:var(--hp-text);}
.hp .hp-btn-white{background:#fff;color:var(--hp-deep);}
.hp-btn-sm{padding:11px 18px;font-size:14px;}
.hp-hero{padding:26px 0 10px;scroll-margin-top:78px;}
.hp-hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:stretch;}
.hp-hero-grid.solo{grid-template-columns:minmax(0,1fr);}
/* The photo panel keeps light text in both themes, so it redefines the colour variables locally. */
.hp-hero-main{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:min(640px,calc(100vh - 130px));border-radius:26px;background:#0B0D14 center/cover no-repeat;color:#fff;box-shadow:var(--hp-shadow);
  --hp-text:#fff;--hp-lead:#D5D8E5;--hp-muted:#C9CCDA;--hp-lav:#A9ADFF;--hp-line2:rgba(255,255,255,.28);--hp-ghost:rgba(255,255,255,.42);}
.hp-hero-main::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,15,.9) 0%,rgba(8,9,15,.62) 50%,rgba(8,9,15,.3) 100%),linear-gradient(0deg,rgba(8,9,15,.8) 0%,transparent 55%);}
.hp-hero-in{position:relative;z-index:1;padding:56px 52px 44px;}
.hp-hero-side{display:flex;flex-direction:column;justify-content:center;}
.hp-install{display:flex;flex-direction:column;gap:20px;padding:30px 28px;border:1px solid var(--hp-line);border-radius:24px;background:var(--hp-card);box-shadow:var(--hp-shadow);}
.hp-install-top{display:flex;align-items:center;gap:16px;}
.hp-app-ic{flex:none;width:64px;height:64px;border-radius:16px;background:#fff;box-shadow:0 12px 26px -12px rgba(58,52,224,.7),0 0 0 1px rgba(20,22,40,.06);}
.hp-install b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.25;letter-spacing:-.02em;}
.hp-install-top span{display:block;margin-top:5px;font-size:14.5px;line-height:1.5;color:var(--hp-muted);}
.hp-install ul{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid var(--hp-line);display:flex;flex-direction:column;gap:12px;}
.hp-install li{display:flex;align-items:center;gap:10px;font-size:14.5px;}
.hp-install li .icon{flex:none;width:18px;height:18px;padding:3px;border-radius:50%;background:rgba(58,52,224,.12);color:var(--hp-lav);}
.hp-install .hp-btn{width:100%;}
.hp-eyebrow{display:flex;align-items:center;gap:14px;color:var(--hp-lav);font-size:13px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;}
.hp-eyebrow.line::before{content:'';width:34px;height:2px;background:var(--hp-lav);}
.hp-h1{font-family:var(--font-display);font-weight:800;font-size:clamp(42px,6.4vw,92px);line-height:.98;letter-spacing:-.045em;margin:22px 0 28px;}
.hp-h1 em{font-style:normal;color:var(--hp-lav);}
.hp-lead{max-width:600px;font-size:19px;line-height:1.65;color:var(--hp-lead);}
.hp-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;}
.hp-facts{display:flex;gap:0;margin-top:70px;flex-wrap:wrap;}
.hp-fact{padding:2px 28px 2px 20px;border-left:1px solid var(--hp-line2);}
.hp-fact b{display:block;font-size:16px;font-weight:700;}
.hp-fact span{display:block;margin-top:5px;font-size:14px;color:var(--hp-muted);}
.hp-sec{padding:110px 0;scroll-margin-top:78px;}
.hp-sec.alt{background:var(--hp-bg2);}
.hp-h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,5vw,62px);line-height:1.04;letter-spacing:-.04em;margin:22px 0 28px;}
.hp-p{font-size:17.5px;line-height:1.75;color:var(--hp-muted);max-width:560px;margin:0 0 22px;}
.hp-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;color:var(--hp-lav);font:inherit;font-weight:700;font-size:16px;cursor:pointer;}
.hp-link .icon{width:15px;height:15px;}
.hp-two{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;}
.hp-photo{position:relative;border-radius:18px;overflow:hidden;min-height:420px;background:var(--hp-card) center/cover no-repeat;box-shadow:var(--hp-shadow);}
.hp-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,9,15,.92) 0,rgba(8,9,15,.2) 55%,transparent);}
.hp-photo-cap{position:absolute;left:34px;bottom:30px;right:34px;z-index:1;color:#fff;}
.hp-photo-cap .hp-eyebrow{font-size:12px;color:#A9ADFF;}
.hp-photo-cap b{display:block;margin-top:10px;font-family:var(--font-display);font-size:26px;line-height:1.35;letter-spacing:-.02em;}
.hp-sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:46px;}
.hp-sec-head .hp-h2{margin-bottom:0;}
.hp-note{color:var(--hp-muted);font-size:17px;line-height:1.75;text-align:right;}
.hp-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}
.hp-card{padding:40px 40px 44px;border:1px solid var(--hp-line);border-radius:16px;background:var(--hp-card-soft);transition:border-color .2s,transform .2s;}
.hp-card:hover{border-color:rgba(142,147,255,.45);transform:translateY(-3px);}
.hp-card-top{display:flex;justify-content:space-between;align-items:center;color:var(--hp-lav);}
.hp-card-top .icon{width:36px;height:36px;stroke-width:1.5;}
.hp-card-k{font-size:14px;letter-spacing:.02em;text-transform:uppercase;}
.hp-card h3{font-family:var(--font-display);font-size:27px;letter-spacing:-.03em;margin:58px 0 16px;}
.hp-card p{margin:0;color:var(--hp-muted);font-size:16.5px;line-height:1.75;}
.hp-step{padding:48px;border:1px solid var(--hp-line);border-radius:18px;background:var(--hp-card);box-shadow:var(--hp-shadow);}
.hp-badge{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid rgba(142,147,255,.45);color:var(--hp-lav);font-size:14px;font-weight:700;}
.hp-step h3{font-family:var(--font-display);font-size:38px;line-height:1.15;letter-spacing:-.035em;margin:26px 0 18px;}
.hp-step p{color:var(--hp-muted);font-size:17px;line-height:1.7;margin:0 0 28px;}
.hp-step .hp-btn{width:100%;}
.hp-step-row{display:flex;gap:12px;flex-wrap:wrap;}
.hp-step-row .hp-btn{flex:1;min-width:180px;}
.hp-member{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;padding-top:26px;border-top:1px solid var(--hp-line);font-weight:700;}
.hp-member .hp-link{color:var(--hp-lav);font-weight:500;text-decoration:underline;text-underline-offset:4px;}
.hp-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:56px;}
.hp-plan{position:relative;display:flex;flex-direction:column;padding:28px;border:1px solid var(--hp-line);border-radius:16px;background:var(--hp-card);transition:border-color .2s,transform .2s;}
.hp-plan:hover{border-color:rgba(142,147,255,.5);transform:translateY(-3px);}
.hp-plan-k{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--hp-lav);}
.hp-plan h4{font-family:var(--font-display);font-size:21px;letter-spacing:-.02em;margin:12px 0 18px;line-height:1.25;}
.hp-plan-price{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.03em;}

.hp-plan-meta{margin:8px 0 26px;color:var(--hp-muted);font-size:14.5px;}
.hp-plan .hp-btn{margin-top:auto;}

.hp-contact{color:#fff;display:grid;grid-template-columns:1fr auto 1fr;gap:56px;align-items:center;padding:72px;border-radius:18px;background:var(--hp-deep);background-image:radial-gradient(circle at 90% 0%,rgba(142,147,255,.3),transparent 45%);}
.hp-contact .hp-eyebrow{color:#fff;opacity:.9;}
.hp-contact .hp-h2{margin-bottom:0;}
.hp-divider{width:1px;align-self:stretch;background:rgba(255,255,255,.22);}
.hp-addr{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;}
.hp-addr .icon{flex:none;width:26px;height:26px;color:#C9CCFF;}
.hp-contact-p{margin:12px 0 0;color:rgba(255,255,255,.85);font-size:17px;line-height:1.7;}
.hp-hours{margin:18px 0 26px;display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:15px;color:rgba(255,255,255,.88);justify-content:start;}
.hp-hours b{font-weight:600;}
.hp-open{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700;}
.hp-open i{width:8px;height:8px;border-radius:50%;background:#3FCB8B;box-shadow:0 0 0 4px rgba(63,203,139,.2);}
.hp-open.closed i{background:#F0A21F;box-shadow:0 0 0 4px rgba(240,162,31,.2);}
.hp-foot{border-top:1px solid var(--hp-line);padding:40px 0;}
.hp-foot .hp-wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hp-foot-c{color:var(--hp-muted);font-size:14px;}
.hp-foot-a{background:none;border:none;color:var(--hp-muted);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.hp-foot-a:hover{color:var(--hp-text);}
.hp-foot-a .icon{width:13px;height:13px;}
@media(max-width:980px){
  .hp-links{display:none;}
  .hp-nav .hp-wrap{justify-content:space-between;}
  .hp-hero-grid{grid-template-columns:minmax(0,1fr);}
  .hp-hero-main{min-height:0;}
  .hp-hero-in{padding:44px 30px 34px;}
  .hp-two,.hp-cards{grid-template-columns:1fr;gap:28px;}
  .hp-contact{grid-template-columns:1fr;padding:40px 28px;gap:28px;}
  .hp-divider{width:100%;height:1px;}
  .hp-note{text-align:left;}
  .hp-sec{padding:76px 0;}
  .hp-step{padding:32px 26px;}
  .hp-card{padding:30px;}
  .hp-card h3{margin-top:34px;}
}
@media(max-width:560px){
  .hp-wrap{padding:0 18px;}
  .hp-nav .hp-wrap{height:66px;gap:10px;}
  .hp-logo img{width:38px;height:38px;}
  .hp-logo-t{font-size:18px;}
  .hp-actions .hp-btn{padding:10px 14px;font-size:13px;}
  .hp-actions .hp-hide-sm{display:none;}
  .hp-actions .hp-show-sm{display:flex;}
  .hp-hero{padding-top:14px;}
  .hp-hero-main{border-radius:20px;}
  .hp-hero-in{padding:34px 20px 26px;}
  .hp-install{padding:22px 20px;}
  .hp-lead{font-size:16.5px;}
  .hp-cta .hp-btn{flex:1;}
  .hp-facts{margin-top:44px;gap:18px;}
  .hp-fact{padding-right:0;}
  .hp-photo{min-height:300px;}
  .hp-step h3{font-size:30px;}
  .hp-addr{font-size:24px;}
  .hp-foot .hp-wrap{flex-direction:column;align-items:flex-start;}
}
.gate-wrap{flex-direction:column;gap:16px;}
.lang-toggle{flex:none;display:inline-flex;align-items:center;gap:2px;height:32px;padding:3px;border:none;border-radius:9px;background:var(--surface-2);cursor:pointer;font:inherit;}
.lang-toggle span{padding:4px 7px;border-radius:7px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--text-muted);transition:background .15s,color .15s;}
.lang-toggle span.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14);}
.lang-toggle:hover span:not(.on){color:var(--text);}
.copyright{font-size:12px;font-weight:500;color:var(--text-faint);text-align:center;letter-spacing:.01em;}
.gate-admin-row{display:flex;justify-content:center;margin-top:18px;}
.gate-admin-link{display:inline-flex;align-items:center;gap:4px;padding:0;border:none;background:none;font:inherit;font-size:12px;font-weight:500;color:var(--text-faint);cursor:pointer;}
.gate-admin-link:hover{color:var(--text);}
.gate-admin-link .icon{width:12px;height:12px;}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 28px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:16px;flex:none;object-fit:contain;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:17px;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;font-weight:700;}
.gate-title{font-size:23px;font-weight:800;margin:2px 0 6px;}
.gate-desc{color:var(--text-muted);font-size:14px;line-height:1.5;margin-bottom:22px;}
.buy-plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-bottom:6px;}
.gate-card .buy-plan-grid{margin-bottom:14px;}
.buy-plan-card{position:relative;border-radius:14px;padding:12px 14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.12s ease;}
.buy-plan-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.buy-plan-card.selected{outline:2px solid var(--accent);outline-offset:-1px;}
.buy-plan-card.gold{background:linear-gradient(155deg,var(--gold-card),var(--gold-card-2));border-color:transparent;color:#EDE2C4;}
.buy-plan-card.gold .plan-eyebrow{color:var(--gold);}
.buy-plan-card.exclusiv{background:linear-gradient(155deg,#211F2E,#302C46);border-color:transparent;color:#E7E4F3;}
.buy-plan-card.exclusiv .plan-eyebrow{color:#C7C2E8;}
.buy-plan-card.unlimited{background:linear-gradient(120deg,#1B1035,#0F2A4A,#12203B,#2A1B4A,#1B1035);background-size:300% 300%;animation:unlimitedShimmer 7s ease infinite;border-color:transparent;color:#F3F1FF;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 50px -18px rgba(120,140,255,.45);}
.buy-plan-card.unlimited .plan-eyebrow{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF,#FFD86B);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:unlimitedText 5s linear infinite;font-weight:800;}
.buy-plan-card.unlimited .plan-price span{color:#C6C2E8;}
@keyframes unlimitedShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes unlimitedText{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.buy-plan-card .plan-name{font-size:13.5px;margin:2px 0;}
.buy-plan-card .plan-price{font-size:18px;}
.buy-plan-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.buy-plan-check .icon{width:12px;height:12px;}
.choice-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--text);font:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:15px 16px;cursor:pointer;transition:.12s;margin-bottom:10px;}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.choice-ic{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
.choice-txt-t{font-weight:700;font-size:14.5px;}
.choice-txt-d{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
.back-link:hover{color:var(--text);}
/* ---- admin layout ---- */
.admin-shell{display:flex;min-height:100vh;}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;width:240px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;gap:4px;border-right:1px solid var(--border);}
.sidebar .brand{padding:2px 8px 20px;margin:0;}
.sidebar .brand-name{color:var(--sidebar-active);}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sidebar-text);transition:.12s;}
.nav-item:hover{background:var(--sidebar-bg-2);color:var(--sidebar-active);}
.nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;padding:16px 12px 6px;}
.section-sub{font-size:13px;color:var(--text-muted);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;font-size:12.5px;}
.sidebar-user b{color:var(--sidebar-active);display:block;font-size:12.5px;}
.sidebar-user span{color:var(--text-faint);font-size:11.5px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;}
.topbar-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;}
.topbar-title{font-size:21px;font-weight:800;font-family:var(--font-display);}
@media(max-width:480px){.topbar-title{font-size:18px;line-height:1.2;}.lock-txt{display:none;}}
.content{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
.mobile-nav{display:none;}
.mobile-nav-backdrop{display:none;}
.nav-toggle{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none;}
@media(max-width:880px){
  .sidebar{display:none;}
  .nav-toggle{display:flex;}
  .mobile-nav-backdrop{display:block;position:fixed;inset:0;background:rgba(10,11,20,.35);z-index:34;}
  .mobile-nav{display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--sidebar-bg);border:1px solid var(--border);border-radius:16px;position:fixed;left:10px;right:10px;top:64px;max-height:75vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:35;}
  .mobile-nav .nav-item{color:var(--sidebar-text);padding:12px 14px;}
  .mobile-nav .nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);}
  .topbar{padding:14px 16px;}
  .content{padding:16px 14px 50px;}
}
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
@media(max-width:1180px){.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:720px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.stat-grid>.stat-card:last-child{grid-column:1/-1;}}
.stat-card{padding:18px 16px;display:flex;align-items:flex-start;gap:14px;border-radius:18px;min-width:0;}
.stat-body{min-width:0;display:flex;flex-direction:column;gap:6px;}
.stat-label{font-size:13px;color:var(--text-muted);font-weight:600;line-height:1.3;}
.stat-numrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.stat-num{font-size:30px;font-weight:800;font-family:var(--font-display);}
.stat-card .stat-num{font-size:26px;line-height:1.1;white-space:nowrap;}
.stat-ic{flex:none;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--t-soft,var(--accent-soft));color:var(--t,var(--accent));}
.pill-xs{padding:2px 8px;font-size:11px;white-space:nowrap;}
.tone-blue{--t:#4C56E8;--t-soft:rgba(76,86,232,.12);} .tone-sky{--t:#2F7FE0;--t-soft:rgba(47,127,224,.13);} .tone-orange{--t:#E0782A;--t-soft:rgba(224,120,42,.14);} .tone-green{--t:#1F9D63;--t-soft:rgba(31,157,99,.13);} .tone-purple{--t:#7058DB;--t-soft:rgba(112,88,219,.13);}
:root[data-theme="dark"] .tone-blue{--t:#8B93FA;} :root[data-theme="dark"] .tone-sky{--t:#6FB0FF;} :root[data-theme="dark"] .tone-orange{--t:#F2A262;} :root[data-theme="dark"] .tone-green{--t:#4FD39A;} :root[data-theme="dark"] .tone-purple{--t:#A792F5;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tone-blue{--t:#8B93FA;} :root:not([data-theme="light"]) .tone-sky{--t:#6FB0FF;} :root:not([data-theme="light"]) .tone-orange{--t:#F2A262;} :root:not([data-theme="light"]) .tone-green{--t:#4FD39A;} :root:not([data-theme="light"]) .tone-purple{--t:#A792F5;} }
@media(max-width:420px){.stat-card{padding:14px 12px;gap:10px;}.stat-ic{width:40px;height:40px;border-radius:12px;}.stat-card .stat-num{font-size:22px;}}
/* ---- page cards (clients, history) ---- */
.pg-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;}
.pg-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.pg-ic{flex:none;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
.pg-ic .icon{width:26px;height:26px;}
.pg-title{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.25;}
.pg-sub{font-size:13.5px;color:var(--text-muted);margin-top:3px;}
.pg-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.pg-filters{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2);}
.pg-filters.hist{grid-template-columns:repeat(3,minmax(0,1fr)) auto;}
.pg-filters .full{grid-column:1/-1;}
.pg-search{position:relative;}
.pg-search>.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}
.pg-search input{padding:13px 42px 13px 44px;border-radius:12px;background:var(--surface);}
.pg-search-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;background:none;border-radius:8px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.pg-search-x:hover{background:var(--surface-2);color:var(--text);}
.fsel{position:relative;min-width:0;}
.fsel>.icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;}
.fsel-l{position:absolute;left:44px;top:8px;font-size:11px;font-weight:600;color:var(--text-muted);pointer-events:none;}
.fsel-chev{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(180deg);color:var(--text-muted);pointer-events:none;display:flex;}
.fsel select{appearance:none;-webkit-appearance:none;padding:25px 36px 8px 44px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-overflow:ellipsis;}
.fsel input[type="date"]{padding:25px 12px 8px 44px;border-radius:12px;background:var(--surface);font-weight:600;}
.pg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);}
.pg-foot b{color:var(--text);}
.pager{display:flex;gap:6px;}
.pager button{min-width:38px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.pager button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pager button:disabled{opacity:.4;cursor:default;}
.pill-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
@media(max-width:760px){.pg-card{padding:14px;border-radius:16px;}.pg-filters,.pg-filters.hist{grid-template-columns:1fr 1fr;padding:10px;gap:10px;}.pg-filters .pg-search{grid-column:1/-1;}.pg-actions{margin-left:0;width:100%;}.pg-actions .btn{flex:1;justify-content:center;}.pg-ic{width:46px;height:46px;border-radius:14px;}.pg-title{font-size:17px;}}
/* client rows */
.crow-list{display:flex;flex-direction:column;gap:8px;}
.crow{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.crow:hover{border-color:var(--accent);box-shadow:var(--shadow);}
.crow .avatar,.crow>img{width:42px!important;height:42px!important;border-radius:50%!important;font-size:14px;}
.crow-main{flex:1;min-width:0;}
.crow-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crow-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crow-sub .dot{margin:0 6px;color:var(--text-faint);}
.crow-mdate{display:none;}
.crow-date{flex:none;font-size:14px;color:var(--text-muted);white-space:nowrap;min-width:96px;text-align:right;}
.crow-div{flex:none;width:1px;height:28px;background:var(--border);}
.crow .pill{flex:none;min-width:96px;justify-content:center;}
.crow-go{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
.crow:hover .crow-go{color:var(--accent);border-color:var(--accent);}
@media(max-width:640px){.crow{gap:10px;padding:10px;}.crow-date,.crow-div{display:none;}.crow-mdate{display:inline;}.crow .pill{min-width:0;}.crow-go{display:none;}}
/* history table */
.hwrap{border:1px solid var(--border);border-radius:14px;overflow-x:auto;}
.htable{width:100%;border-collapse:collapse;font-size:13.5px;}
.htable th{background:var(--surface-2);padding:12px 14px;white-space:nowrap;}
.htable td{padding:10px 14px;}
.htable tr td:first-child,.htable tr th:first-child{padding-left:16px;}
.htable tr td:last-child,.htable tr th:last-child{padding-right:12px;}
.htable tr:hover td{background:var(--surface-2);}
.hclient{display:flex;align-items:center;gap:12px;min-width:200px;}
.hclient .avatar{width:38px;height:38px;border-radius:50%;font-size:13px;}
.hname{font-weight:700;}
.hsub,.htime{font-size:12.5px;color:var(--text-muted);}
.hdate{white-space:nowrap;}
.hmore{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.hmore:hover{color:var(--accent);border-color:var(--accent);}
.pg-card.compact{gap:14px;}
.pg-card.compact .pg-ic{width:46px;height:46px;border-radius:14px;}
.pg-card.compact .pg-ic .icon{width:22px;height:22px;}
.pg-card.compact .pg-title{font-size:16.5px;}

function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; const loc=(state&&state.lang==='ru')?'ru-RU':'ro-RO'; return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso; const loc=(state&&state.lang==='ru')?'ru-RU':'ro-RO'; return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'}); }
function money(n,cur){ n=Number(n||0); return n.toLocaleString('ro-RO',{maximumFractionDigits:0})+' '+(cur||'MDL'); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localDay(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)? '' : localISO(d); }
function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); const n=Math.max(-36500, Math.min(36500, Number(days||0))); d.setDate(d.getDate()+n); return localISO(d); }
function todayStr(){ return localISO(new Date()); }

function browserSave(filename, data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(e){ return false; }
}

let rafPending=false;
function scheduleRender(){ if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; render(); }); }
function showToast(msg){ state.toast=msg; scheduleRender(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{ state.toast=null; scheduleRender(); },2600); }

/* ============ INIT & SUBSCRIPTIONS ============ */
async function init(){
  try{
    if(/^#(admin|panou)$/i.test(location.hash) || new URLSearchParams(location.search).has('admin')) state.screen='admin-gate';
    // The installed app opens on "Contul meu"; a remembered member code then goes straight to the account.
    else if(new URLSearchParams(location.search).has('app') || isStandaloneApp()) state.screen='client-gate';
  }catch(e){}
  render();
  try{
    if(typeof FIREBASE_CONFIG==='undefined' || !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) throw new Error('missing-config');
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){ db = null; console.error('Firebase init failed:', e); }
  state.dbOk = !!db;
  if(!db){ state.ready=true; scheduleRender(); return; }
  subscribeAll();
}
function subscribeAll(){
  refSettings().onSnapshot(snap=>{
    state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    state.ready=true; scheduleRender();
  }, ()=>{ state.ready=true; scheduleRender(); });
  colTypes().orderBy('price','asc').onSnapshot(snap=>{ state.types=snap.docs.map(d=>Object.assign({id:d.id}, d.data())); scheduleRender(); }, ()=>{});
  colClients().onSnapshot(snap=>{
    state.clients=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    try{
      let codeParam=new URLSearchParams(location.search).get('cod');
      if(!codeParam){ codeParam=localStorage.getItem('fp_client_code'); }
      if(codeParam){
        const c=state.clients.find(x=>x.code===codeParam.trim().toUpperCase());
        if(c && state.clientSession!==c.id){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; stopCamera(); try{ localStorage.setItem('fp_client_code', c.code); }catch(e){} }
      } else {
        const pendingPhone=localStorage.getItem('fp_pending_phone'); const pendingAt=localStorage.getItem('fp_pending_at');
        if(pendingPhone && pendingAt && !state.clientSession){
          const digits=pendingPhone.replace(/\D/g,'');
          // Only a client created after this browser's request counts, so typing someone else's phone never opens their account.
          const c=state.clients.find(x=>(x.phone||'').replace(/\D/g,'')===digits && (x.createdAt||'')>=pendingAt);
          if(c){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; stopCamera(); try{ localStorage.setItem('fp_client_code', c.code); localStorage.removeItem('fp_pending_phone'); localStorage.removeItem('fp_pending_at'); }catch(e){} }
        }
      }
    }catch(e){}
    scheduleRender();
  }, ()=>{});
}
let staffUnsubs=[];
async function subscribeStaff(){
  unsubscribeStaff();
  // Firestore picks up the new login token asynchronously; wait until a staff-only read succeeds, otherwise the listeners would start as anonymous and die with permission-denied.
  for(let i=0;i<8;i++){ try{ await colPay().limit(1).get(); break; }catch(e){ await new Promise(r=>setTimeout(r,500)); } }
  if(!state.adminUnlocked) return;
  const toList=snap=>snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
  staffUnsubs=[
    colLog().orderBy('timestamp','desc').limit(1500).onSnapshot(snap=>{ state.log=toList(snap); scheduleRender(); }, ()=>{}),
    colPay().orderBy('date','desc').limit(60).onSnapshot(snap=>{ state.payments=toList(snap); scheduleRender(); }, ()=>{}),
    colMod().orderBy('date','desc').limit(80).onSnapshot(snap=>{ state.modLog=toList(snap); scheduleRender(); }, ()=>{}),
    colBuyReq().orderBy('date','desc').limit(50).onSnapshot(snap=>{ state.buyRequests=toList(snap); scheduleRender(); }, ()=>{}),
  ];
}
function unsubscribeStaff(){
  staffUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  staffUnsubs=[]; state.log=[]; state.payments=[]; state.modLog=[]; state.buyRequests=[];
}

function typeById(id){ return state.types.find(t=>t.id===id); }
function typeDisplayName(t){ if(!t) return ''; return (state.lang==='ru' && t.nameRu) ? t.nameRu : t.name; }
function subTypeDisplayName(c){ const sub=(c&&c.subscription)||{}; const t=typeById(sub.typeId); if(t) return typeDisplayName(t); return sub.typeName||''; }
function isValidMdPhone(phone){ const digits=(phone||'').replace(/\D/g,''); return /^0[67]\d{7}$/.test(digits) || /^373[67]\d{7}$/.test(digits); }
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((email||'').trim()); }
function pastelForClient(c){
  const sub=(c&&c.subscription)||{};
  if(sub.unlimited) return null;
  if(sub.tier==='exclusiv') return EXCLUSIV_ACCENT;
  if(sub.tier==='gold') return null;
  const sorted=state.types.slice().sort((a,b)=>(a.price||0)-(b.price||0));
  const idx=sorted.findIndex(x=>x.id===sub.typeId);
  return idx>=0 ? PLAN_PASTELS[idx % PLAN_PASTELS.length] : null;
}

function subStatus(c){
  const sub=c.subscription;
  if(c.paused) return {label:tr('stSuspended'), tone:'warning'};
  if(!sub || !sub.validTo) return {label:tr('stNoSub'), tone:'muted'};
  const dl=daysLeft(sub.validTo);
  const due=(sub.totalDue||0)-(sub.totalPaid||0);
  if(dl<0) return {label:tr('stExpired'), tone:'danger'};
  if(due>0.5) return {label:tr('stUnpaid'), tone:'danger'};
  const warn = (state.settings && state.settings.warnDays!=null) ? state.settings.warnDays : 5;
  if(dl<=warn) return {label: dl===0?tr('stExpiresToday'):expiresInLabel(dl), tone:'warning'};
  return {label:tr('stValid'), tone:'success'};
}
function toneForResult(r){
  if(r==='permis') return 'success';
  if(r==='necunoscut'||r==='neachitat'||r==='expirat'||r==='limita') return 'danger';
  if(r==='suspendat'||r==='orar'||r==='orar_sala'||r==='inchis'||r==='prea_devreme') return 'warning';
  if(r==='neinceput') return 'info';
  return 'muted';
}
function inTimeWindow(date, fromStr, toStr){
  const [fh,fm]=fromStr.split(':').map(Number); const [th,tm]=toStr.split(':').map(Number);
  const mins=date.getHours()*60+date.getMinutes(); const f=fh*60+fm, t=th*60+tm;
  if(f<=t) return mins>=f && mins<=t; return mins>=f || mins<=t;
}
// Weekly schedule, indexed like Date.getDay() (0 = Sunday). Older settings only had one opening
// interval (plus an optional Saturday one), so those are converted on the fly.
function defaultWeekSchedule(s){
  s=s||DEFAULT_SETTINGS; const openDays=s.openDays||DEFAULT_SETTINGS.openDays;
  return [0,1,2,3,4,5,6].map(day=>{
    const sat=day===6 && s.saturdayDifferent;
    const from=sat? (s.saturdayOpenHour||DEFAULT_SETTINGS.saturdayOpenHour) : (s.openHour||DEFAULT_SETTINGS.openHour);
    const to=sat? (s.saturdayCloseHour||DEFAULT_SETTINGS.saturdayCloseHour) : (s.closeHour||DEFAULT_SETTINGS.closeHour);
    return {open: openDays[day]!==false, intervals:[{from, to}]};
  });
}
function weekScheduleOf(s){ const w=s&&s.weekSchedule; return (Array.isArray(w) && w.length===7)? w : defaultWeekSchedule(s); }
function gymScheduleFor(date, s){
  s=s||DEFAULT_SETTINGS;
  const day=weekScheduleOf(s)[date.getDay()]||{}; const intervals=(day.intervals||[]).filter(iv=>iv&&iv.from&&iv.to);
  const closedToday=!day.open || !intervals.length || (s.closedDates||[]).includes(localISO(date));
  return {closedToday, intervals};
}
function generateUniqueCode(){
  for(let i=0;i<25;i++){ const n=Math.floor(1000+Math.random()*9000); const code='GYM-'+n; if(!state.clients.some(c=>c.code===code)) return code; }
  return 'GYM-'+String(Date.now()).slice(-4);
}
function normalizeMemberCode(input){
  let v=(input||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(v.slice(0,3)==='GYM') v=v.slice(3);
  const digits=v.replace(/[^0-9]/g,'');
  return digits? ('GYM-'+digits) : '';
}
function formatGymCode(v){ v=(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.slice(0,3)==='GYM') return 'GYM-'+v.slice(3); return v; } async function verifyAccess(rawCode){
  if(!db) return;
  const code=normalizeMemberCode(rawCode);
  if(!code) return;
  const client=state.clients.find(c=>c.code===code);
  const now=new Date();
  const gs=gymScheduleFor(now, state.settings); let result='permis', message='Acces permis';
  if(!client){ result='necunoscut'; message='Cod QR necunoscut'; }
  else if(client.paused){ result='suspendat'; message='Acces suspendat'; } else if(gs.closedToday){ result='inchis'; message='Sala este închisă în această zi.'; } else if(!gs.intervals.some(iv=>inTimeWindow(now, iv.from, iv.to))){ result='orar_sala'; message='Sala este deschisă azi: '+gs.intervals.map(iv=>iv.from+'–'+iv.to).join(', ')+'.'; }
  else{
    const sub=client.subscription||{};
    if(sub.validFrom && sub.validFrom>todayStr()){ result='neinceput'; message='Abonamentul începe pe '+fmtDate(sub.validFrom); }
    else{
      const dl = sub.validTo? daysLeft(sub.validTo) : null;
      const due=(sub.totalDue||0)-(sub.totalPaid||0);
      if(dl!==null && dl<0){ result='expirat'; message='Abonament expirat'; }
      else if(due>0.5){ result='neachitat'; message='Abonament neachitat'; }
      else{
        const type=typeById(sub.typeId);
        const af=(type&&type.accessFrom)||sub.accessFrom, at=(type&&type.accessTo)||sub.accessTo;
        const limit=Number((type&&type.entryLimit)||sub.entryLimit||0);
        if(af && at && !inTimeWindow(now,af,at)){ result='orar'; message='Acces permis doar între '+af+' și '+at; }
        else if(limit && Number(sub.entriesUsed||0)>=limit){ result='limita'; message='Limita de '+limit+' intrări a fost atinsă'; }
        else{
          const mm=(state.settings&&state.settings.minMinutesBetweenEntries)||0;
          if(mm && client.lastEntryAt){
            const diffMin=(now-new Date(client.lastEntryAt))/60000;
            if(diffMin<mm){ result='prea_devreme'; message='Prea devreme — mai așteaptă '+Math.ceil(mm-diffMin)+' min'; }
          }
        }
      }
    }
  }
  try{
    await colLog().add({clientId: client?client.id:null, clientName: client?client.name:'Cod necunoscut', code, timestamp: now.toISOString(), result, message});
    if(client){
      const recentEntries=[{t:now.toISOString(), r:result}].concat(client.recentEntries||[]).slice(0,20);
      await colClients().doc(client.id).update(Object.assign({recentEntries}, result==='permis'? {lastEntryAt:now.toISOString(), 'subscription.entriesUsed':firebase.firestore.FieldValue.increment(1)} : {}));
    }
  }catch(e){}
  state.lastResult={client, result, message, code}; state.scanInput='';
  scheduleRender();
}

function gymAddress(s){
  const rawAddr=((s&&s.address)||'').trim(); const addrOk=rawAddr.replace(/[^\p{L}\d]/gu,'').length>=6;
  const cut=addrOk? rawAddr.lastIndexOf(',') : -1;
  const street=!addrOk? HOME_DEFAULT_STREET : cut>0? rawAddr.slice(0,cut).trim() : rawAddr;
  const city=!addrOk? HOME_DEFAULT_CITY : cut>0? rawAddr.slice(cut+1).trim() : '';
  const fullAddr=city? street+', '+city : street;
  return {street, city, fullAddr, mapUrl:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(fullAddr+', Moldova')};
}
// Groups consecutive days with the same hours: "Luni – Vineri 08:00–21:00".
function homeHoursRows(s){
  const w=weekScheduleOf(s); const rows=[];
  SCHEDULE_DAY_ORDER.forEach(day=>{ const x=w[day]; const txt=(x.open && (x.intervals||[]).length)? x.intervals.map(v=>v.from+'–'+v.to).join(', ') : ht('closed');
    const last=rows[rows.length-1]; if(last && last.txt===txt){ last.to=day; } else rows.push({from:day, to:day, txt}); });
  return rows.map(r=>'<b>'+esc(dayLabel(r.from))+(r.from!==r.to? ' – '+esc(dayLabel(r.to)) : '')+'</b><span>'+esc(r.txt)+'</span>').join('');
}

function emailConfigured(){ return typeof EMAIL_SCRIPT_URL!=='undefined' && !!EMAIL_SCRIPT_URL; }
async function notifyClientByEmail(client, kind, silent){
  try{
    if(!client || !client.id || !client.email || !emailConfigured()) return;
    const user=firebase.auth().currentUser; if(!user || user.isAnonymous) return;
    const idToken=await user.getIdToken();
    // text/plain avoids a CORS preflight, which Apps Script web apps don't answer.
    const res=await fetch(EMAIL_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ idToken, clientId:client.id, kind:kind||'activated' }) });
    const data=await res.json();
    if(silent) return;
    if(data.ok) showToast(ra('Email trimis clientului: ')+client.email);
    else showToast(ra('Emailul către client nu a fost trimis')+' ('+data.error+').');
  }catch(e){ if(!silent) showToast(ra('Emailul către client nu a fost trimis')+' (network).'); }
}
async function submitBuyRequest(){
  const f=state.buyForm||{};
  if(!f.photoDataUri){ state.formErr=tr('errPhoto'); scheduleRender(); return; }
  if(!f.name||!f.name.trim()){ state.formErr=tr('errEnterName'); scheduleRender(); return; }
  if(!f.phone||!f.phone.trim()){ state.formErr=tr('errEnterPhone'); scheduleRender(); return; }
  if(!isValidMdPhone(f.phone)){ state.formErr=tr('errPhoneInvalid'); scheduleRender(); return; }
  if(!f.email||!f.email.trim()){ state.formErr=tr('errEnterEmail'); scheduleRender(); return; }
  if(!isValidEmail(f.email)){ state.formErr=tr('errEmailInvalid'); scheduleRender(); return; }
  if(!f.birthYear){ state.formErr=tr('errBirthDate'); scheduleRender(); return; }
  if(!f.typeId){ state.formErr=tr('errChoosePlan'); scheduleRender(); return; }
  const t=typeById(f.typeId);
  try{ await colBuyReq().add({ name:f.name.trim(), phone:f.phone.trim(), email:(f.email||'').trim(), birthDate:combineBirthDate(f.birthYear), typeId:f.typeId, typeName:t?t.name:'', price:t?t.price:0, currency:t?t.currency:'MDL', note:f.note||'', wantsTrainer:!!f.wantsTrainer, wantsPrinted:!!f.wantsPrinted, photoDataUri:f.photoDataUri, status:'pending', date:new Date().toISOString() }); state.buySubmitted=true; state.formErr=''; try{ localStorage.setItem('fp_pending_phone', f.phone.trim()); localStorage.setItem('fp_pending_at', new Date().toISOString()); }catch(e){} scheduleRender(); }
  catch(e){ state.formErr=tr('toastReqError'); scheduleRender(); }
}

/* ---- Reception ---- */
function renderReception(){
  const total=state.clients.length;
  const validCount=state.clients.filter(c=>{ const s=subStatus(c); return !c.paused && (s.tone==='success'||s.tone==='warning'); }).length;
  const expSoon=state.clients.filter(c=>{ const s=subStatus(c); return s.tone==='warning' && !c.paused; });
  const dlOf=c=>{ const d=daysLeft(c.subscription&&c.subscription.validTo); return d==null? 999 : d; };
  expSoon.sort((a,b)=>dlOf(a)-dlOf(b));
  const today=todayStr();
  const todayEntries=state.log.filter(l=>l.result==='permis' && localDay(l.timestamp)===today).length;
  const todayRevenue=state.payments.filter(p=>localDay(p.date)===today).reduce((s,p)=>s+Number(p.amount||0),0);
  const yesterday=addDays(today,-1);
  const yesterdayEntries=state.log.filter(l=>l.result==='permis' && localDay(l.timestamp)===yesterday).length;
  const yesterdayRevenue=state.payments.filter(p=>localDay(p.date)===yesterday).reduce((s,p)=>s+Number(p.amount||0),0);
  const newThisMonth=state.clients.filter(c=>localDay(c.createdAt).slice(0,7)===today.slice(0,7)).length;
  const pctValid=total? Math.round(validCount*100/total) : 0;
  const expToday=expSoon.filter(c=>dlOf(c)===0).length;
  const currency=(state.settings&&state.settings.currency);
  const stat=(label,num,ic,tone,pill,pillTone)=>'<div class="card stat-card tone-'+tone+'"><div class="stat-ic">'+icon(ic)+'</div><div class="stat-body"><div class="stat-label">'+label+'</div><div class="stat-numrow"><span class="stat-num">'+num+'</span>'+(pill? '<span class="pill pill-xs pill-'+pillTone+'">'+esc(pill)+'</span>' : '')+'</div></div></div>';
  const expCards=expSoon.slice(0,12).map(c=>{ const dl=daysLeft(c.subscription.validTo); return '<div class="exp-card'+(dl<=1?' urgent':'')+'"><div class="exp-name">'+esc(c.name)+'</div><div class="exp-meta">'+daysLeftShort(dl)+' · '+fmtDate(c.subscription.validTo)+'</div></div>'; }).join('') || '<div class="empty-state small">'+ra('Niciun abonament nu expiră curând.')+'</div>';
  const emailable=expSoon.filter(c=>c.email);
  const reminderBtn = expSoon.length? ('<button class="btn btn-ghost btn-sm" data-action="send-expiry-reminders"'+(emailable.length?'':' disabled')+'>'+icon('send','icon-sm')+' '+ra('Trimite reamintire')+' ('+emailable.length+')</button>') : '';
  const recent=state.log.slice(0,7);
  const recentRows=recent.length? recent.map(logRowHtml).join('') : '<div class="empty-state small">'+ra('Nicio scanare încă.')+'</div>';
  return ''
   + '<div class="stat-grid">'
     + stat(ra('Clienți înregistrați'), total, 'users', 'blue', '+'+newThisMonth+' '+ra('luna aceasta'), newThisMonth? 'success' : 'muted')
     + stat(ra('Abonamente valabile'), validCount, 'shield', 'sky', pctValid+'% '+ra('din total'), 'success')
     + stat(expInLabel((state.settings&&state.settings.warnDays)||5), expSoon.length, 'clock', 'orange', ra('azi')+': '+expToday, expToday? 'warning' : 'muted')
     + stat(ra('Intrări azi'), todayEntries, 'logIn', 'green', ra('ieri')+': '+yesterdayEntries, 'muted')
     + stat(ra('Încasări azi'), money(todayRevenue,currency), 'chart', 'purple', ra('ieri')+': '+money(yesterdayRevenue,currency), 'muted')
   + '</div>'
   + '<div class="card" style="padding:18px 20px;"><div class="section-head"><div class="section-title">'+ra('Abonamente care expiră curând')+'</div>'+reminderBtn+'</div><div class="expiring-grid" style="margin-top:12px;">'+expCards+'</div></div>'
   + '<div class="two-col">'+scanCardHtml()+'<div class="card" style="padding:18px 20px;"><div class="section-title">'+ra('Ultimele scanări')+'</div><div style="margin-top:8px;">'+recentRows+'</div></div></div>';
}
async function sendExpiryReminders(){
  if(!emailConfigured()){ showToast(ra('Trimiterea emailurilor nu este configurată încă.')); return; }
  const expSoon=state.clients.filter(c=>{ const s=subStatus(c); return s.tone==='warning' && !c.paused && c.email; });
  if(!expSoon.length){ showToast(ra('Niciun client cu email de contactat.')); return; }
  expSoon.forEach(c=>notifyClientByEmail(c,'expiring',true));
  await logMod('Reamintiri expirare trimise', expSoon.length+' clienți');
  showToast((state.lang==='ru'? 'Отправлено напоминаний: ':'Reamintiri trimise: ')+expSoon.length);
}
function scanCardHtml(){

/* ---- Requests (all client requests in one place) ---- */
function renderRequests(){
  const pendingBuys=(state.buyRequests||[]).filter(r=>r.status==='pending' && r.kind!=='photo');
  const pendingPhotos=(state.buyRequests||[]).filter(r=>r.status==='pending' && r.kind==='photo');

  const allReqOps=(state.modLog||[]).filter(l=>l.operation==='Cerere antrenor personal' || l.operation==='Cerere card tipărit');
  const pendingOps=allReqOps.filter(l=>l.resolved!==true).slice(0,30);
  const resolvedOps=allReqOps.filter(l=>l.resolved===true).slice(0,10);

  const sep='<span class="sep">·</span>';

  const row=(avIcon, main, when, actions, photo)=>'<div class="rq-row"><div class="rq-av'+(photo?' big':'')+'">'+(photo? '<img src="'+photo+'" alt="">' : icon(avIcon,'icon-sm'))+'</div><div class="rq-main">'+main+'</div>'+time(when)+(actions? '<div class="rq-actions">'+actions+'</div>' : '')+'</div>';

  const section=(key, cls, ic, title, desc, count, body)=>{

     + '<button class="rq-head" data-action="toggle-req" data-id="'+key+'" aria-expanded="'+(!collapsed)+'" title="'+esc(collapsed? ra('Extinde') : ra('Restrânge'))+'">'
       + '<span class="rq-ic">'+icon(ic)+'</span>'

     + '</button>'
     + (collapsed? '' : '<div class="rq-list">'+body+'</div>')
     + '</section>';
  };

  const buyRows=pendingBuys.length? pendingBuys.map(r=>{
    const t=typeById(r.typeId);
    const needsOwner=t && t.tier==='exclusiv' && state.adminRole!=='owner';
    const main=esc(r.name)+sep+esc(r.phone)+sep+esc(t? typeDisplayName(t) : r.typeName)+sep+money(r.price,r.currency)
      + (r.wantsTrainer? '<span class="rq-chip">'+icon('dumbbell','icon-sm')+' '+esc(ra('antrenor'))+'</span>' : '')
      + (r.wantsPrinted? '<span class="rq-chip">'+icon('printer','icon-sm')+' '+esc(ra('tipărit'))+'</span>' : '');
    const actions=(needsOwner? '<span class="small faint">'+icon('lock','icon-sm')+' '+esc(ra('Necesită aprobarea unui proprietar'))+'</span>'
        : '<button class="btn btn-primary btn-sm" data-action="convert-buy-request" data-id="'+r.id+'">'+icon('userPlus','icon-sm')+' '+esc(ra('Creează client'))+'</button>')
      + '<button class="btn btn-ghost btn-sm rq-reject" data-action="reject-buy-request" data-id="'+r.id+'">'+icon('x','icon-sm')+' '+esc(ra('Respinge'))+'</button>';
    return row('user', main, r.date, actions, r.photoDataUri);
  }).join('') : empty('cart');

  const photoRows=pendingPhotos.map(r=>{
    const c=state.clients.find(x=>x.id===r.clientId);
    return row('camera', esc(r.clientName||'—')+sep+'<span class="mono">'+esc(r.code||'')+'</span>'+(c&&c.photoDataUri? '<span class="rq-chip">'+icon('refresh','icon-sm')+' '+esc(ra('înlocuiește poza actuală'))+'</span>' : ''), r.date,
      '<button class="btn btn-primary btn-sm" data-action="approve-photo-request" data-id="'+r.id+'">'+icon('check','icon-sm')+' '+esc(ra('Aprobă'))+'</button>'
      + '<button class="btn btn-ghost btn-sm rq-reject" data-action="reject-photo-request" data-id="'+r.id+'">'+icon('x','icon-sm')+' '+esc(ra('Respinge'))+'</button>'
      + (c? '<button class="btn btn-ghost btn-sm" data-action="open-client-detail" data-id="'+c.id+'">'+icon('user','icon-sm')+' '+esc(ra('Vezi fișa'))+'</button>' : ''), r.photoDataUri);
  }).join('');

  const cardRows=cardPending.length? cardPending.map(c=>row('card',
      esc(c.name)+sep+esc(c.phone)+sep+esc(ra('cod curent'))+' <span class="mono">'+esc(c.code)+'</span>',
      c.cardRequestAt,
      '<button class="btn btn-primary btn-sm" data-action="approve-card-request" data-id="'+c.id+'">'+icon('check','icon-sm')+' '+esc(ra('Aprobă (10 MDL)'))+'</button>'
      + '<button class="btn btn-ghost btn-sm rq-reject" data-action="reject-card-request" data-id="'+c.id+'">'+icon('x','icon-sm')+' '+esc(ra('Respinge'))+'</button>'
      + '<button class="btn btn-ghost btn-sm" data-action="open-client-detail" data-id="'+c.id+'">'+icon('user','icon-sm')+' '+esc(ra('Vezi fișa'))+'</button>')).join('') : empty('card');

  const opIcon=l=> l.operation==='Cerere antrenor personal'? 'userPlus' : 'printer';
  const pendingOpsRows=pendingOps.length? pendingOps.map(l=>row(opIcon(l), esc(ra(l.operation))+' — '+esc(l.actor||''), l.date,
      '<button class="btn btn-ghost btn-sm rq-resolve" data-action="resolve-request" data-id="'+l.id+'">'+icon('check','icon-sm')+' '+esc(ra('Marchează rezolvat'))+'</button>')).join('') : empty('dumbbell');
  const resolvedOpsRows=resolvedOps.map(l=>row(opIcon(l), esc(ra(l.operation))+' — '+esc(l.actor||''), l.date, '')).join('');

  return '<div class="section-sub">'+ra('Toate cererile clienților, într-un singur loc')+'</div>'
   + section('buy', 'rq-buy', 'cart', ra('Cereri de cumpărare abonament'), ra('Clienți care doresc să achiziționeze un abonament.'), pendingBuys.length, buyRows)
   + (pendingPhotos.length? section('photo', 'rq-photo', 'camera', ra('Poze de profil de la clienți'), ra('Clienți care și-au trimis poza din contul lor.'), pendingPhotos.length, photoRows) : '')
   + section('card', 'rq-card', 'card', ra('Cereri card pierdut'), ra('Clienți care au raportat pierderea cardului de acces.'), cardPending.length, cardRows)
   + section('ops', 'rq-ops', 'dumbbell', ra('Cereri antrenor personal / card tipărit'), ra('Solicitări pentru antrenor personal sau card tipărit.'), pendingOps.length, pendingOpsRows)
   + (resolvedOps.length? section('done', 'rq-done', 'check', ra('Rezolvate recent'), ra('Ultimele cereri marcate ca rezolvate.'), resolvedOps.length, resolvedOpsRows) : '');
}

async function saveNewClient(){
  const f=state.form;
  if(!f.name||!f.name.trim()){ state.formErr=ra('Introdu numele clientului.'); scheduleRender(); return; }
  if(!f.phone||!f.phone.trim()){ state.formErr=ra('Introdu numărul de telefon.'); scheduleRender(); return; }
  if(!isValidMdPhone(f.phone)){ state.formErr=ra('Numărul de telefon nu este valid (format: 0XX XXX XXX).'); scheduleRender(); return; }
  if(!f.email||!f.email.trim()){ state.formErr=ra('Introdu adresa de email a clientului.'); scheduleRender(); return; }
  if(!isValidEmail(f.email)){ state.formErr=ra('Adresa de email nu este validă (ex: nume@gmail.com).'); scheduleRender(); return; }
  if(!f.birthYear){ state.formErr=ra('Completează data nașterii.'); scheduleRender(); return; }
  if(!f.typeId){ state.formErr=ra('Alege un abonament.'); scheduleRender(); return; }

    if(!state.clients.find(x=>x.id===ref.id)){ state.clients=state.clients.concat([Object.assign({id:ref.id}, doc)]); }
    if(paid>0){ await colPay().add({clientId:ref.id, clientName:doc.name, amount:paid, currency:f.currency, method:f.method, date:new Date().toISOString(), note:'Abonament nou'}); }
    await logMod('Client nou înregistrat', doc.name+' · '+doc.subscription.typeName);
    if(f.fromRequest){ colBuyReq().doc(f.fromRequest).update({status:'converted', clientId:ref.id}).catch(()=>{}); }
    showToast((state.lang==='ru'?'Клиент создан: ':'Client creat: ')+code);
    if(paid>=Number(f.price||0)-0.5){ notifyClientByEmail(Object.assign({id:ref.id}, doc)); }
    openModal('clientDetail', {id:ref.id});
  }catch(e){ state.formErr=ra('A apărut o eroare. Încearcă din nou.'); scheduleRender(); }

const HISTORY_PAGE_SIZE=25;
function historyFiltersActive(){ return !!((state.historyQuery||'').trim() || (state.historyPeriod||'all')!=='all' || (state.historyTime||'all')!=='all' || (state.historyResult||'all')!=='all'); }
function filteredHistory(){
  const q=(state.historyQuery||'').toLowerCase().trim(); const qDigits=q.replace(/\D/g,'');
  const period=state.historyPeriod||'all', time=state.historyTime||'all', res=state.historyResult||'all';
  const today=todayStr();
  let from='', to='';
  if(period==='today'){ from=to=today; }
  else if(period==='yesterday'){ from=to=addDays(today,-1); }
  else if(period==='7d'){ from=addDays(today,-6); to=today; }
  else if(period==='month'){ from=today.slice(0,8)+'01'; to=today; }
  else if(period==='custom'){ from=state.historyFrom||''; to=state.historyTo||''; }
  const hourRange={morning:[6,12], afternoon:[12,18], evening:[18,24], night:[0,6]}[time];
  const byId={}; state.clients.forEach(c=>{ byId[c.id]=c; });
  return state.log.filter(l=>{
    if(q){ const c=byId[l.clientId]; const hit=(l.clientName||'').toLowerCase().includes(q) || (l.code||'').toLowerCase().includes(q) || (qDigits && c && (c.phone||'').replace(/\D/g,'').includes(qDigits)); if(!hit) return false; }
    const day=localDay(l.timestamp);
    if(from && day<from) return false;
    if(to && day>to) return false;
    if(hourRange){ const h=new Date(l.timestamp).getHours(); if(!(h>=hourRange[0] && h<hourRange[1])) return false; }
    if(res==='ok' && l.result!=='permis') return false;
    if(res==='denied' && l.result==='permis') return false;
    return true;
  });
}

async function saveType(){

    entryLimit:(f.entryLimit===''||f.entryLimit==null)?null:Number(f.entryLimit), accessFrom:f.accessFrom||null, accessTo:f.accessTo||null,
    tier:f.tier||'fitness', active:f.active!==false, order: (f.order!=null? f.order : state.types.length) };

function reportRange(){
  const p=state.reportPeriod||'31d'; const today=todayStr();
  if(p==='7d') return {from:addDays(today,-6), to:today};
  if(p==='month') return {from:today.slice(0,8)+'01', to:today};
  if(p==='lastmonth'){ const d=new Date(today.slice(0,8)+'01T00:00:00'); d.setMonth(d.getMonth()-1); const end=new Date(d.getFullYear(), d.getMonth()+1, 0); return {from:localISO(d), to:localISO(end)}; }
  if(p==='custom'){ const a=state.reportFrom||addDays(today,-30), b=state.reportTo||today; return a<=b? {from:a,to:b} : {from:b,to:a}; }
  return {from:addDays(today,-30), to:today};
}
function daysInRange(from, to){ const out=[]; let d=from; while(d<=to && out.length<400){ out.push(d); d=addDays(d,1); } return out; }
// Only the last 60 payments are streamed live, so the report loads the selected period (plus the
// previous one, for the trend) on demand.
function ensureReportPayments(from, to){
  const key=from+'|'+to;
  if(state.reportPayKey===key || !db) return;
  state.reportPayKey=key; state.reportPayments=null;
  const a=new Date(from+'T00:00:00').toISOString(), b=new Date(addDays(to,1)+'T00:00:00').toISOString();
  colPay().where('date','>=',a).where('date','<',b).orderBy('date','desc').limit(3000).get()
    .then(snap=>{ if(state.reportPayKey!==key) return; state.reportPayments=snap.docs.map(d=>Object.assign({id:d.id}, d.data())); scheduleRender(); })
    .catch(()=>{ if(state.reportPayKey===key){ state.reportPayments=state.payments.slice(); scheduleRender(); } });
}
function trendPill(cur, prev, prevLabel){
  const title=' title="'+esc(ra('Față de perioada anterioară')+' ('+prevLabel+')')+'"';
  if(!prev) return cur? '<span class="pill pill-xs pill-success trend"'+title+'>'+icon('arrowUp')+' '+esc(ra('nou'))+'</span>' : '<span class="pill pill-xs pill-muted"'+title+'>—</span>';
  const pct=Math.round((cur-prev)*100/prev);
  if(pct===0) return '<span class="pill pill-xs pill-muted"'+title+'>0%</span>';
  return '<span class="pill pill-xs '+(pct>0?'pill-success':'pill-danger')+' trend"'+title+'>'+icon(pct>0?'arrowUp':'arrowDown')+' '+(pct>0?'+':'−')+Math.abs(pct)+'%</span>';
}
function niceAxis(max){ const steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000]; const step=steps.find(s=>max/s<=5)||Math.ceil(max/5); const top=Math.max(step*4, step*Math.ceil(max/step)); const ticks=[]; for(let v=0; v<=top; v+=step) ticks.push(v); return {top, ticks}; }
function barChartHtml(values, labels, titles){
  const ax=niceAxis(Math.max(1,...values));
  const every=Math.max(1, Math.ceil(values.length/11));
  return '<div class="rc"><div class="rc-y">'+ax.ticks.map(v=>'<span style="bottom:'+(v/ax.top*100)+'%;">'+v+'</span>').join('')+'</div>'
   + '<div class="rc-plot"><div class="rc-grid">'+ax.ticks.map(v=>'<i style="bottom:'+(v/ax.top*100)+'%;"></i>').join('')+'</div>'
   + '<div class="rc-cols">'+values.map((v,i)=>'<div class="rc-col" title="'+esc(titles[i])+'"><div class="rc-barwrap"><div class="rc-bar'+(v?'':' zero')+'" style="height:'+(v/ax.top*100)+'%;"></div></div><div class="rc-lab">'+(i%every===0? esc(labels[i]) : '')+'</div></div>').join('')+'</div></div></div>';
}

async function exportCSV(kind){
  let rows=[], filename='';
  if(kind==='clients'){ filename='clienti.csv'; rows=[['Nume','Telefon','Email','Cod membru','Abonament','Valabil de la','Valabil până la','Stare']];
    state.clients.forEach(c=>{ const st=subStatus(c); const sub=c.subscription||{}; rows.push([c.name, c.phone||'', c.email||'', c.code, sub.typeName||'', sub.validFrom||'', sub.unlimited? 'nelimitat' : (sub.validTo||''), st.label]); }); }
  else if(kind==='types'){ filename='abonamente.csv'; rows=[['Denumire','Preț','Monedă','Durată (zile)','Nivel']];
    state.types.forEach(t=>rows.push([t.name,t.price,t.currency,t.unlimited?'nelimitat':t.durationDays,t.tier])); }
  else if(kind==='payments'){ filename='incasari.csv'; rows=[['Data','Client','Sumă','Monedă','Metodă','Notă']];
    let all=state.payments;
    try{ const snap=await colPay().orderBy('date','desc').get(); all=snap.docs.map(d=>d.data()); }catch(e){}
    all.forEach(p=>rows.push([fmtDateTime(p.date), p.clientName, p.amount, p.currency, payMethodLabel(p.method), p.note||''])); }
  else if(kind==='report'){
    const {from, to}=reportRange(); filename='raport-'+from+'_'+to+'.csv';
    const inR=iso=>{ const d=localDay(iso); return d>=from && d<=to; };
    const pays=(state.reportPayments||state.payments).filter(p=>inR(p.date));
    const entries=state.log.filter(l=>l.result==='permis' && inR(l.timestamp));
    const perDay={}; entries.forEach(l=>{ const d=localDay(l.timestamp); perDay[d]=(perDay[d]||0)+1; });
    rows=[['Raport Fitness Park', fmtDate(from)+' – '+fmtDate(to)], [],
      ['Total intrări', entries.length], ['Încasări totale', pays.reduce((s,p)=>s+Number(p.amount||0),0)], ['Număr plăți', pays.length],
      ['Abonamente vândute', pays.filter(p=>p.note==='Abonament nou'||p.note==='Reînnoire abonament').length], [],
      ['Data','Intrări']];
    daysInRange(from,to).forEach(d=>rows.push([fmtDate(d), perDay[d]||0]));
    rows.push([], ['Data plății','Client','Sumă','Monedă','Metodă','Notă']);
    pays.forEach(p=>rows.push([fmtDateTime(p.date), p.clientName, p.amount, p.currency, payMethodLabel(p.method), p.note||''])); }
  else if(kind==='accesslog'){ filename='istoric-acces.csv'; rows=[['Data','Ora','Client','Telefon','Cod','Rezultat','Observații']];
    const byId={}; state.clients.forEach(c=>{ byId[c.id]=c; });
    filteredHistory().forEach(l=>{ const d=new Date(l.timestamp); const c=byId[l.clientId]; rows.push([localDay(l.timestamp), isNaN(d)?'':d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}), l.clientName||'', (c&&c.phone)||'', l.code||'', resultLabel(l.result), l.message||'']); }); }
  const csv=rows.map(r=>r.map(v=>{ v=String(v==null?'':v); return /[",;\n]/.test(v)? ('"'+v.replace(/"/g,'""')+'"') : v; }).join(',')).join('\r\n');
  const ok=browserSave(filename, new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  showToast(ok? ra('Fișier salvat.') : ra('Exportul a eșuat.'));
}

async function saveSchedule(){
  const w=JSON.parse(JSON.stringify(state.settingsDraft.weekSchedule));
  for(const day of SCHEDULE_DAY_ORDER){
    const x=w[day]; if(!x.open) continue;
    if(!x.intervals.length){ showToast(dayLabel(day)+': '+ra('adaugă un interval sau marchează ziua ca închisă.')); return; }
    x.intervals.sort((a,b)=>a.from.localeCompare(b.from));
    for(let i=0;i<x.intervals.length;i++){
      const iv=x.intervals[i];
      if(iv.from>=iv.to){ showToast(dayLabel(day)+': '+ra('ora de început trebuie să fie înaintea orei de închidere.')); return; }
      if(i && iv.from<x.intervals[i-1].to){ showToast(dayLabel(day)+': '+ra('intervalele se suprapun.')); return; }
    }
  }
  // Keep the old single-interval fields in sync for anything that still reads them.
  const firstOpen=SCHEDULE_DAY_ORDER.map(d=>w[d]).find(x=>x.open&&x.intervals.length);
  const legacy=firstOpen? {openHour:firstOpen.intervals[0].from, closeHour:firstOpen.intervals[firstOpen.intervals.length-1].to} : {};
  try{ await saveSettingsDoc(Object.assign({weekSchedule:w, openDays:w.map(x=>!!x.open), saturdayDifferent:false}, legacy)); state.settingsDraft.weekSchedule=w; await logMod('Program de lucru actualizat',''); showToast(ra('Programul a fost salvat.')); }
  catch(e){ showToast(ra('Eroare la salvare.')); }
}
async function uploadGymLogo(file){
  if(!file || !/^image\//.test(file.type)){ showToast(ra('Alege o imagine (PNG sau JPG).')); return; }
  if(file.size>2*1024*1024){ showToast(ra('Imaginea e prea mare (maxim 2 MB).')); return; }
  try{
    const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=160, k=Math.min(1, max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    state.settingsDraft.logoDataUri=cv.toDataURL('image/png'); scheduleRender();
  }catch(e){ showToast(ra('Nu am putut citi imaginea.')); }
}

async function saveEditTeam(){

async function changePassword(){
  const f=state.pwForm||{};
  const user=firebase.auth().currentUser;
  if(!user || !user.email){ state.pwErr=ra('Nu ești autentificat cu un cont de email.'); scheduleRender(); return; }
  if(!f.current){ state.pwErr=ra('Introdu parola curentă.'); scheduleRender(); return; }
  if(!f.next||f.next.length<6){ state.pwErr=ra('Parola nouă trebuie să aibă minim 6 caractere.'); scheduleRender(); return; }
  if(f.next!==f.confirm){ state.pwErr=ra('Parolele nu coincid.'); scheduleRender(); return; }
  try{
    const cred=firebase.auth.EmailAuthProvider.credential(user.email, f.current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(f.next);
  }catch(e){
    if(e && (e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')){ state.pwErr=ra('Parola curentă este greșită.'); }
    else if(e && e.code==='auth/password-does-not-meet-requirements'){ state.pwErr=ra('Parola nouă nu îndeplinește cerințele de securitate (adaugă litere mari, mici și cifre).'); }
    else if(e && e.code==='auth/too-many-requests'){ state.pwErr=ra('Prea multe încercări. Așteaptă puțin și mai încearcă o dată.'); }
    else if(e && e.code==='auth/requires-recent-login'){ state.pwErr=ra('Sesiunea a expirat. Ieși din cont și intră din nou, apoi încearcă.'); }
    else{ state.pwErr=ra('Eroare la schimbarea parolei')+(e&&e.code?(' ('+e.code+')'):(e&&e.message?(': '+e.message):''))+'.'; }
    scheduleRender();
    return;
  }
  state.pwForm={}; state.pwErr=''; showToast(ra('Parola a fost schimbată.'));
  scheduleRender();
  try{ await logMod('Parolă schimbată', user.email); }catch(e){}
}
async function addTeam(){
  const f=state.teamForm||{};
  const email=(f.email||'').trim().toLowerCase();
  if(!email||!email.includes('@')){ showToast(ra('Introdu un e-mail valid.')); return; }
  const pass=f.password||'';
  if(!pass||pass.length<6){ showToast(ra('Parola inițială trebuie să aibă minim 6 caractere.')); return; }
  const existing=((state.settings&&state.settings.team)||[]); const hasOwner=existing.some(m=>m.role==='owner'); if(!(state.adminRole==='owner'||(!hasOwner&&state.adminRole==='admin'))){ showToast(ra('Doar proprietarul poate gestiona echipa.')); return; }
  if(existing.some(m=>(m.email||'').toLowerCase()===email)){ showToast(ra('Acest email are deja acces.')); return; }
  let secondaryApp=null; let reused=false;
  try{
    secondaryApp=firebase.initializeApp(firebase.app().options, 'teamAdd'+Date.now());
    await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
    await secondaryApp.delete();
  }catch(e){
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(_e){} }
    if(e && e.code==='auth/email-already-in-use'){ reused=true; }
    else if(e && e.code==='auth/weak-password'){ showToast(ra('Parola trebuie să aibă minim 6 caractere.')); return; }
    else{ showToast(ra('Eroare la crearea contului.')); return; }

  const team=existing.slice(); team.push({email, role:f.role==='owner'?'owner':'admin', name:(f.name||'').trim()});
  try{ await saveSettingsDoc({team}); state.teamForm={}; if(state.modal&&state.modal.type==='addTeam') closeModal(); await logMod('Acces echipă adăugat', email); showToast(reused? ra('Acces redat — acest email avea deja un cont Firebase; colegul intră cu parola lui veche, nu cu cea introdusă acum.') : ra('Cont creat — colegul poate intra cu acest email și parola primită.')); }
  catch(e){ showToast(ra('Eroare la salvarea accesului.')); }

// A request is "pending" until staff resolve it. Clients can't write their own record, so the time
// of the request is also remembered in this browser to show the pending state right away.
function clientRequestPending(c, kind){
  const askedServer=c[kind+'RequestAt']||''; let askedLocal=''; try{ askedLocal=localStorage.getItem('fp_'+kind+'_req_'+c.id)||''; }catch(e){}
  const asked=[askedServer, askedLocal].sort().pop();
  if(!asked || (Date.now()-new Date(asked).getTime())>14*86400000) return false;
  const done=c[kind+'ResolvedAt']||''; return !(done && done>=asked);
}
