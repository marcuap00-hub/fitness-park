<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Fitness Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{height:100%;margin:0;}
:root{
  --bg:#F1F2F8; --surface:#FFFFFF; --surface-2:#F7F8FC; --border:#E3E5F0;
  --text:#171A24; --text-muted:#666C82; --text-faint:#9599AC;
  --sidebar-bg:#FFFFFF; --sidebar-bg-2:#ECEDFC; --sidebar-text:#666C82; --sidebar-active:#171A24;
  --accent:#4C56E8; --accent-strong:#3A43D1; --accent-soft:#ECEDFC; --accent-contrast:#FFFFFF;
  --gold:#C9A24B; --gold-ink:#2A2410; --gold-card:#181A26; --gold-card-2:#22243A;
  --success:#178A54; --success-bg:#E4F6EC; --warning:#B4680A; --warning-bg:#FDF0DD;
  --danger:#C22A2A; --danger-bg:#FCE9E9; --info:#2457C9; --info-bg:#E8EFFD;
  --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.12);
  --shadow-lg:0 20px 60px -20px rgba(10,12,30,.35);
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
    --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
    --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
    --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
    --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
    --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
    --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C13; --surface:#15161F; --surface-2:#1B1D29; --border:#2A2D3D;
  --text:#EEEFF5; --text-muted:#A2A6BA; --text-faint:#6D7086;
  --sidebar-bg:#08090F; --sidebar-bg-2:#14151F; --sidebar-text:#8A8EA3; --sidebar-active:#FFFFFF;
  --accent:#6B74F5; --accent-strong:#8189F7; --accent-soft:#20223D; --accent-contrast:#FFFFFF;
  --gold:#D9B65E; --gold-ink:#171307; --gold-card:#14151F; --gold-card-2:#1C1E30;
  --success:#3FCB8B; --success-bg:#123322; --warning:#E2A23C; --warning-bg:#3A2A0F;
  --danger:#F0605F; --danger-bg:#3A1414; --info:#6C9BF5; --info-bg:#152540;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);}
h1,h2,h3,h4,.disp{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
#app{min-height:100%;}
.icon{width:18px;height:18px;flex:none;display:block;}
.icon-sm{width:15px;height:15px;}
.icon-lg{width:26px;height:26px;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.12s ease;white-space:normal;text-align:center;line-height:1.3;min-width:0;font-family:var(--font-body);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:var(--accent-contrast);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-soft{background:var(--accent-soft);color:var(--accent);}
.btn-soft:hover{filter:brightness(0.97);}
.btn-gold{background:var(--gold);color:var(--gold-ink);}
.btn-exclusiv{background:#C7C2E8;color:#211F2E;}
.btn-unlimited{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF);color:#171307;font-weight:700;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:default;}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.12s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.gate-card label.field{margin-bottom:14px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);}
.checkline input{width:16px;height:16px;padding:0;}
.addon-check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:14px;}
.addon-check input{width:20px;height:20px;padding:0;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.01em;}
.pill-success{background:var(--success-bg);color:var(--success);}
.pill-warning{background:var(--warning-bg);color:var(--warning);}
.pill-danger{background:var(--danger-bg);color:var(--danger);}
.pill-info{background:var(--info-bg);color:var(--info);}
.pill-muted{background:var(--surface-2);color:var(--text-muted);}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);flex:none;font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.toast{position:fixed;left:50%;top:16px;bottom:auto;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:900;max-width:90vw;text-align:center;}
.overlay{position:fixed;inset:0;background:rgba(10,11,20,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:800;padding:0;}
@media(min-width:720px){.overlay{align-items:center;padding:24px;}}
.modal{background:var(--surface);width:100%;max-width:580px;max-height:95vh;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);padding:22px;display:flex;flex-direction:column;gap:20px;}
@media(min-width:720px){.modal{border-radius:20px;}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-close{background:var(--surface-2);border:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.grid2{grid-template-columns:1fr;}}
.grid3-birth{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;}
@media(max-width:380px){.grid3-birth{grid-template-columns:1fr;}}
.hairline{height:1px;background:var(--border);border:none;margin:2px 0;}
/* ---- gate screens ---- */
.gate-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:
  radial-gradient(1000px 500px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--gold), transparent 35%),
  var(--bg);}
:root[data-theme="dark"] .gate-wrap, @media (prefers-color-scheme:dark){.gate-wrap{opacity:1;}}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:34px 28px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:16px;flex:none;object-fit:contain;padding:4px;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:17px;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;font-weight:700;}
.gate-title{font-size:23px;font-weight:800;margin:2px 0 6px;}
.gate-desc{color:var(--text-muted);font-size:14px;line-height:1.5;margin-bottom:22px;}
.buy-plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-bottom:6px;}
.gate-card .buy-plan-grid{margin-bottom:14px;}
.buy-plan-card{position:relative;border-radius:14px;padding:12px 14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.12s ease;}
.buy-plan-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.buy-plan-card.selected{outline:2px solid var(--accent);outline-offset:-1px;}
.buy-plan-card.gold{background:linear-gradient(155deg,var(--gold-card),var(--gold-card-2));border-color:transparent;color:#EDE2C4;}
.buy-plan-card.gold .plan-eyebrow{color:var(--gold);}
.buy-plan-card.exclusiv{background:linear-gradient(155deg,#211F2E,#302C46);border-color:transparent;color:#E7E4F3;}
.buy-plan-card.exclusiv .plan-eyebrow{color:#C7C2E8;}
.buy-plan-card.unlimited{background:linear-gradient(120deg,#1B1035,#0F2A4A,#12203B,#2A1B4A,#1B1035);background-size:300% 300%;animation:unlimitedShimmer 7s ease infinite;border-color:transparent;color:#F3F1FF;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 50px -18px rgba(120,140,255,.45);}
.buy-plan-card.unlimited .plan-eyebrow{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF,#FFD86B);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:unlimitedText 5s linear infinite;font-weight:800;}
.buy-plan-card.unlimited .plan-price span{color:#C6C2E8;}
@keyframes unlimitedShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes unlimitedText{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.buy-plan-card .plan-name{font-size:13.5px;margin:2px 0;}
.buy-plan-card .plan-price{font-size:18px;}
.buy-plan-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.buy-plan-check .icon{width:12px;height:12px;}
.choice-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:15px 16px;cursor:pointer;transition:.12s;margin-bottom:10px;}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.choice-ic{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
.choice-txt-t{font-weight:700;font-size:14.5px;}
.choice-txt-d{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
.back-link:hover{color:var(--text);}
/* ---- admin layout ---- */
.admin-shell{display:flex;min-height:100%;}
.sidebar{width:240px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:20px 14px;gap:4px;border-right:1px solid var(--border);}
.sidebar .brand{padding:2px 8px 20px;margin:0;}
.sidebar .brand-name{color:var(--sidebar-active);}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sidebar-text);transition:.12s;}
.nav-item:hover{background:var(--sidebar-bg-2);color:var(--sidebar-active);}
.nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;padding:16px 12px 6px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;font-size:12.5px;}
.sidebar-user b{color:var(--sidebar-active);display:block;font-size:12.5px;}
.sidebar-user span{color:var(--text-faint);font-size:11.5px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;}
.topbar-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;}
.topbar-title{font-size:21px;font-weight:800;font-family:var(--font-display);}
.content{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
.mobile-nav{display:none;}
.mobile-nav-backdrop{display:none;}
.nav-toggle{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none;}
@media(max-width:880px){
  .sidebar{display:none;}
  .nav-toggle{display:flex;}
  .mobile-nav-backdrop{display:block;position:fixed;inset:0;background:rgba(10,11,20,.35);z-index:34;}
  .mobile-nav{display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--sidebar-bg);border:1px solid var(--border);border-radius:16px;position:fixed;left:10px;right:10px;top:64px;max-height:75vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:35;}
  .mobile-nav .nav-item{color:var(--sidebar-text);padding:12px 14px;}
  .mobile-nav .nav-item.active{background:var(--sidebar-bg-2);color:var(--accent);}
  .topbar{padding:14px 16px;}
  .content{padding:16px 14px 50px;}
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{padding:18px 20px;display:flex;flex-direction:column;gap:8px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;}
.stat-num{font-size:30px;font-weight:800;font-family:var(--font-display);}
.stat-ic{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.section-title{font-size:16px;font-weight:800;font-family:var(--font-display);}
.section-title small{display:block;font-size:12px;color:var(--text-muted);font-weight:500;margin-top:2px;font-family:var(--font-body);}
.expiring-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.exp-card{background:var(--warning-bg);border:1px solid transparent;border-radius:12px;padding:11px 13px;}
.exp-card.urgent{background:var(--danger-bg);}
.exp-name{font-weight:700;font-size:13.5px;}
.exp-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
.scan-box{padding:22px;text-align:center;}
.scan-zone{border:2px dashed var(--border);border-radius:16px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);position:relative;overflow:hidden;}
.scan-zone.ok{border-color:var(--success);background:var(--success-bg);}
.scan-zone.bad{border-color:var(--danger);background:var(--danger-bg);}
.scan-ic-wrap{width:58px;height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.scan-title{font-weight:700;font-size:15px;}
.scan-sub{font-size:12.5px;color:var(--text-muted);}
video.scan-video{width:100%;max-width:280px;border-radius:12px;margin-top:6px;}
.result-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface-2);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:0 12px 10px;}
td{padding:12px;border-top:1px solid var(--border);vertical-align:middle;}
.table-wrap{overflow-x:auto;}
tr td:first-child,tr th:first-child{padding-left:0;}
tr td:last-child,tr th:last-child{padding-right:0;text-align:right;}
.search-row{display:flex;gap:10px;}
.client-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;}
.client-row:hover{background:var(--surface-2);}
.client-row:last-child{border-bottom:none;}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.plan-card{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);background:var(--surface);}
.plan-card.gold{background:linear-gradient(155deg,var(--gold-card),var(--gold-card-2));border-color:transparent;color:#EDE2C4;}
.plan-card.exclusiv{background:linear-gradient(155deg,#211F2E,#302C46);border-color:transparent;color:#E7E4F3;}
.plan-card.unlimited{background:linear-gradient(120deg,#1B1035,#0F2A4A,#12203B,#2A1B4A,#1B1035);background-size:300% 300%;animation:unlimitedShimmer 7s ease infinite;border-color:transparent;color:#F3F1FF;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 50px -18px rgba(120,140,255,.45);}
.plan-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-faint);}
.plan-card.gold .plan-eyebrow{color:var(--gold);}
.plan-card.exclusiv .plan-eyebrow{color:#C7C2E8;}
.plan-name{font-family:var(--font-display);font-weight:700;font-size:15.5px;}
.plan-price{font-family:var(--font-display);font-weight:800;font-size:28px;white-space:nowrap;}
.plan-price span{font-size:13px;font-weight:600;color:var(--text-muted);}
.plan-card.gold .plan-price span{color:#B9AE8E;}
.plan-meta{font-size:12px;color:var(--text-muted);}
.plan-card.gold .plan-meta{color:#B9AE8E;}
.plan-card.unlimited .plan-eyebrow{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF,#FFD86B);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:unlimitedText 5s linear infinite;font-weight:800;}
.plan-card.unlimited .plan-price span,.plan-card.unlimited .plan-meta,.buy-plan-card.unlimited .plan-price span{color:#C6C2E8;}
.qr-wrap{background:#fff;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;}
.qr-wrap img,.qr-wrap canvas{border-radius:8px;}
.code-chip{font-family:var(--font-mono);font-weight:700;letter-spacing:.04em;background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px;text-align:center;font-size:17px;}
.modal-wide{max-width:640px;}
@media(min-width:900px){.modal-wide{max-width:840px;}}
@media(min-width:1200px){.modal-wide{max-width:960px;}}
.cd-left{display:flex;flex-direction:column;gap:14px;min-width:0;}
.cd-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:26px 22px;border-radius:18px;color:#fff;background:radial-gradient(circle at 88% 18%,rgba(107,116,245,.45),transparent 48%),radial-gradient(circle at 6% 115%,rgba(201,162,75,.28),transparent 45%),linear-gradient(135deg,#10111A,#1F2136);box-shadow:var(--shadow);}
.cd-hero-mark{position:absolute;right:-20px;bottom:-26px;width:150px;height:150px;opacity:.08;transform:rotate(-12deg);pointer-events:none;}
.cd-avatar{position:relative;flex:none;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 0 0 3px rgba(255,255,255,.85),0 10px 30px -8px rgba(0,0,0,.6);}
.cd-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.cd-dot{position:absolute;right:2px;bottom:2px;width:17px;height:17px;border-radius:50%;border:3px solid #17182A;background:#8A8EA3;}
.cd-dot-success{background:#22C06B;} .cd-dot-warning{background:#F0A21F;} .cd-dot-danger{background:#E5484D;}
.cd-name{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.15;margin-bottom:8px;word-break:break-word;}
.cd-photo-btn{flex:1;justify-content:center;border:1.5px dashed var(--text-faint);cursor:pointer;}
.cd-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cd-quick .btn{flex-direction:column;gap:6px;padding:12px 6px;min-height:66px;white-space:normal;line-height:1.2;text-align:center;font-size:12px;}
.cd-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;}
.cd-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.cd-card-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:15px;}
.cd-card-title .icon{color:var(--accent);}
.cd-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cd-tile{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);min-width:0;}
.cd-tile-wide{grid-column:1/-1;}
.cd-tile-ic,.cd-plan-ic{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
.cd-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:3px;}
.cd-value{font-weight:700;font-size:14.5px;word-break:break-word;}
.cd-sub{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:10px;}
.cd-sub-col{padding:12px;border-radius:12px;background:var(--surface-2);min-width:0;}
.cd-plan{display:flex;align-items:center;gap:10px;margin-top:2px;}
.cd-plan-gold{background:linear-gradient(135deg,#E6C469,#B98A2E);color:#2A2410;}
.cd-plan-exclusiv{background:#C7C2E8;color:#211F2E;}
.cd-plan-unlimited{background:linear-gradient(135deg,#FFD86B,#FF8FD6,#6BD8FF);color:#171307;}
.cd-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;}
.cd-card-head+.cd-row{border-top:none;}
.cd-extra{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.cd-grid{display:grid;gap:20px;align-items:start;grid-template-columns:minmax(0,1fr) 280px;}
.cd-right{display:flex;flex-direction:column;gap:10px;min-width:0;}
@media(min-width:900px){.cd-grid{grid-template-columns:minmax(0,1fr) 300px;}}
@media(min-width:1280px){
  .modal-wide.modal-detail{max-width:min(1200px,94vw);}
  .cd-grid{grid-template-columns:minmax(0,1fr) 340px;gap:24px;}
  .cd-tiles{grid-template-columns:repeat(3,1fr);}
  .cd-tile-wide{grid-column:span 2;}
  .cd-hero{padding:18px 22px;}
  .cd-left{gap:12px;}
  .cd-card{padding:14px;}
}
@media(max-width:640px){.cd-grid{grid-template-columns:1fr;}}
@media(max-width:899px){.cd-sub{grid-template-columns:1fr;}}
@media(max-width:420px){.cd-tiles{grid-template-columns:1fr;}.cd-hero{padding:20px 16px;gap:14px;}.cd-avatar{width:68px;height:68px;font-size:22px;}.cd-name{font-size:20px;}}
.info-list{display:flex;flex-direction:column;gap:12px;}
.info-row .info-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:2px;}
.info-row .info-value{font-size:14px;}
.member-card{border:1.5px solid var(--gold);border-radius:var(--radius-l);padding:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
@media print{
  body *{visibility:hidden;}
  .member-card,.member-card *{visibility:visible;}
  .member-card{
    position:fixed;top:1cm;left:50%;transform:translateX(-50%);
    width:55mm;height:85mm;box-sizing:border-box;background:#fff!important;
    border-width:1.4px!important;border-radius:4mm!important;padding:6mm 4mm 5mm!important;
    display:flex!important;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center!important;gap:2mm;
  }
  .member-card,.member-card .mc-name,.member-card .mc-code{color:#171A24!important;}
  .member-card .mc-brand{color:#171A24!important;font-size:8px!important;justify-content:center;}
  .member-card .mc-name{font-size:14px!important;line-height:1.2;margin-top:1mm;}
  .member-card .qr-wrap{padding:0!important;margin:3mm 0 2mm;}
  .member-card .qr-wrap canvas,.member-card .qr-wrap img{width:36mm!important;height:36mm!important;}
  .member-card .mc-plan{color:#555!important;font-size:8.5px!important;line-height:1.4;}
  .member-card .mc-code{border-color:#171A24!important;background:#fff!important;font-size:13px!important;padding:1.6mm 4mm!important;margin-top:auto;}
  .member-card .mc-eyebrow,.member-card .mc-footer{display:none!important;}
  .member-card.unlimited{border-color:#C9A24B!important;border-width:1.8px!important;background:linear-gradient(180deg,#FCF6E4,#fff)!important;}
}
.member-card .qr-wrap{padding:10px;} .member-card .mc-brand{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);} .member-card .mc-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-top:4px;} .member-card .mc-name{font-family:var(--font-display);font-weight:700;font-size:15px;} .member-card .mc-plan{font-size:12px;color:var(--text-muted);line-height:1.5;} .member-card .mc-code{color:var(--gold);border-color:var(--gold);}
.member-card .mc-footer{font-size:10.5px;color:var(--text-faint);margin-top:4px;}
.member-card.unlimited{background:linear-gradient(155deg,#1B1035,#12203B);border-color:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 16px 40px -16px rgba(120,140,255,.5);}
.member-card.unlimited .mc-brand,.member-card.unlimited .mc-name{color:#F3F1FF;}
.member-card.unlimited .mc-eyebrow{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF,#FFD86B);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:unlimitedText 5s linear infinite;}
.member-card.unlimited .mc-plan{color:#C6C2E8;}
.member-card.unlimited .mc-code{color:#FFD86B;border-color:#FFD86B;}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;}
.bar{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
.bar.hi{background:var(--accent);}
.empty-state{padding:36px 16px;text-align:center;color:var(--text-muted);}
.empty-state .icon-lg{margin:0 auto 10px;color:var(--text-faint);}
.settings-block{display:flex;flex-direction:column;gap:14px;}
.team-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border-radius:12px;}
.news-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
/* ---- client portal ---- */
.client-shell{min-height:100%;background:var(--bg);}
.client-top{background:var(--sidebar-bg);color:var(--sidebar-active);padding:18px 20px 46px;border-bottom:1px solid var(--border);}
.client-header-row{display:flex;align-items:center;justify-content:space-between;}
.client-body{max-width:520px;margin:-30px auto 0;padding:0 16px 50px;display:flex;flex-direction:column;gap:16px;}
.sub-card{border-radius:20px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);}
.sub-card.tone-success{background:linear-gradient(150deg,#1B8F5D,#106040);}
.sub-card.tone-warning{background:linear-gradient(150deg,#C97F14,#8C5203);}
.sub-card.tone-danger{background:linear-gradient(150deg,#C0362F,#7E1F1B);}
.sub-card.tone-muted{background:linear-gradient(150deg,#3A3E52,#22243380);}
.sub-card.tone-gold{background:linear-gradient(150deg,var(--gold-card),var(--gold-card-2));}
.sub-card.tone-unlimited{background:linear-gradient(120deg,#1B1035,#0F2A4A,#12203B,#2A1B4A,#1B1035);background-size:300% 300%;animation:unlimitedShimmer 7s ease infinite;box-shadow:var(--shadow-lg),0 0 40px -10px rgba(120,140,255,.55);}
.sub-card.tone-unlimited .sub-days{background:linear-gradient(90deg,#FFD86B,#FF8FD6,#6BD8FF,#FFD86B);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:unlimitedText 5s linear infinite;}
.sub-top{display:flex;justify-content:space-between;align-items:flex-start;}
.sub-days{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;margin-top:10px;}
.sub-days span{font-size:13px;font-weight:600;opacity:.8;display:block;margin-top:4px;}
.sub-range{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:16px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;}
.client-tabs{display:flex;gap:8px;background:var(--surface-2);padding:4px;border-radius:12px;}
.client-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-muted);}
.client-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
.rule-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.5;}
.rule-item:last-child{border-bottom:none;}
[hidden]{display:none!important;}
.w-full{width:100%;}
.flex{display:flex;}
.gap8{gap:8px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}
.small{font-size:12px;}
.center{text-align:center;}
.mt4{margin-top:4px;}
.mb0{margin-bottom:0;}
.err-text{color:var(--danger);font-size:12.5px;font-weight:600;min-height:16px;}
</style>

function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; const loc=(state&&state.lang==='ru')?'ru-RU':'ro-RO'; return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso; const loc=(state&&state.lang==='ru')?'ru-RU':'ro-RO'; return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'}); }
function money(n,cur){ n=Number(n||0); return n.toLocaleString('ro-RO',{maximumFractionDigits:0})+' '+(cur||'MDL'); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); const n=Math.max(-36500, Math.min(36500, Number(days||0))); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
async function sha256(text){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text||'')); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function setPath(obj, path, value){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(o==null) return; } o[parts[parts.length-1]]=value; }
function daysLeft(validTo){ if(!validTo) return null; const today=new Date(); today.setHours(0,0,0,0); const vt=new Date(validTo+'T00:00:00'); return Math.round((vt-today)/86400000); }
function payMethodLabel(m){ if(state.lang==='ru') return {cash:'Наличные',card:'Карта',transfer:'Банковский перевод'}[m]||m; return {cash:'Numerar',card:'Card',transfer:'Transfer bancar'}[m]||m; }

function tr(key){ const lang=(state&&state.lang)||'ro'; const v=I18N[lang]&&I18N[lang][key]; return v!=null? v : (I18N.ro[key]!=null? I18N.ro[key] : key); }
function expiresInLabel(dl){ const lang=(state&&state.lang)||'ro'; if(lang==='ru'){ return 'Истекает через '+dl+' '+(dl===1?'день':((dl>=2&&dl<=4)?'дня':'дней')); } return 'Expiră în '+dl+' '+(dl===1?'zi':'zile'); }

function ruMonths(n){ n=Math.abs(n); const m10=n%10, m100=n%100; if(m100>=11&&m100<=14) return 'месяцев'; if(m10===1) return 'месяц'; if(m10>=2&&m10<=4) return 'месяца'; return 'месяцев'; }
function ruEntries(n){ n=Math.abs(n); const m10=n%10, m100=n%100; if(m100>=11&&m100<=14) return 'посещений'; if(m10===1) return 'посещение'; if(m10>=2&&m10<=4) return 'посещения'; return 'посещений'; }
function ruClients(n){ n=Math.abs(n); const m10=n%10, m100=n%100; if(m100>=11&&m100<=14) return 'клиентов'; if(m10===1) return 'клиент'; if(m10>=2&&m10<=4) return 'клиента'; return 'клиентов'; }
function ruChecks(n){ n=Math.abs(n); const m10=n%10, m100=n%100; if(m100>=11&&m100<=14) return 'проверок'; if(m10===1) return 'проверка'; if(m10>=2&&m10<=4) return 'проверки'; return 'проверок'; }

function expInLabel(n){ if(state.lang==='ru') return 'Истекает через '+n+' '+ruDays(n); return 'Expiră în '+n+' zile'; }

function browserSave(filename, data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(e){ return false; }
}

}

let rafPending=false;
function scheduleRender(){ if(rafPending) return; rafPending=true; requestAnimationFrame(()=>{ rafPending=false; render(); }); }
function showToast(msg){ state.toast=msg; scheduleRender(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{ state.toast=null; scheduleRender(); },2600); }
async function logMod(operation, details){ try{ await colMod().add({date:new Date().toISOString(), operation, actor:(firebase.auth().currentUser&&firebase.auth().currentUser.email)||'Administrator', details:details||''}); }catch(e){} }

/* ============ INIT & SUBSCRIPTIONS ============ */
async function init(){
  render();
  try{
    if(typeof FIREBASE_CONFIG==='undefined' || !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) throw new Error('missing-config');
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){ db = null; console.error('Firebase init failed:', e); }
  state.dbOk = !!db;
  if(!db){ state.ready=true; scheduleRender(); return; }
  subscribeAll();
}
function subscribeAll(){
  refSettings().onSnapshot(snap=>{
    state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    state.ready=true; scheduleRender();
  }, ()=>{ state.ready=true; scheduleRender(); });
  colTypes().orderBy('price','asc').onSnapshot(snap=>{ state.types=snap.docs.map(d=>Object.assign({id:d.id}, d.data())); scheduleRender(); }, ()=>{});
  colClients().onSnapshot(snap=>{
    state.clients=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    try{
      let codeParam=new URLSearchParams(location.search).get('cod');
      if(!codeParam){ codeParam=localStorage.getItem('fp_client_code'); }
      if(codeParam){
        const c=state.clients.find(x=>x.code===codeParam.trim().toUpperCase());
        if(c && state.clientSession!==c.id){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; stopCamera(); try{ localStorage.setItem('fp_client_code', c.code); }catch(e){} }
      } else {
        const pendingPhone=localStorage.getItem('fp_pending_phone');
        if(pendingPhone && !state.clientSession){
          const digits=pendingPhone.replace(/\D/g,'');
          const c=state.clients.find(x=>(x.phone||'').replace(/\D/g,'')===digits);
          if(c){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; stopCamera(); try{ localStorage.setItem('fp_client_code', c.code); localStorage.removeItem('fp_pending_phone'); }catch(e){} }
        }
      }
    }catch(e){}
    scheduleRender();
  }, ()=>{});
}
let staffUnsubs=[];
async function subscribeStaff(){
  unsubscribeStaff();
  // Firestore picks up the new login token asynchronously; wait until a staff-only read succeeds, otherwise the listeners would start as anonymous and die with permission-denied.
  for(let i=0;i<8;i++){ try{ await colPay().limit(1).get(); break; }catch(e){ await new Promise(r=>setTimeout(r,500)); } }
  if(!state.adminUnlocked) return;
  const toList=snap=>snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
  staffUnsubs=[
    colLog().orderBy('timestamp','desc').limit(1500).onSnapshot(snap=>{ state.log=toList(snap); scheduleRender(); }, ()=>{}),
    colPay().orderBy('date','desc').limit(60).onSnapshot(snap=>{ state.payments=toList(snap); scheduleRender(); }, ()=>{}),
    colMod().orderBy('date','desc').limit(80).onSnapshot(snap=>{ state.modLog=toList(snap); scheduleRender(); }, ()=>{}),
    colBuyReq().orderBy('date','desc').limit(50).onSnapshot(snap=>{ state.buyRequests=toList(snap); scheduleRender(); }, ()=>{}),
  ];
}
function unsubscribeStaff(){
  staffUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  staffUnsubs=[]; state.log=[]; state.payments=[]; state.modLog=[]; state.buyRequests=[];
}

function typeById(id){ return state.types.find(t=>t.id===id); }
function typeDisplayName(t){ if(!t) return ''; return (state.lang==='ru' && t.nameRu) ? t.nameRu : t.name; }
function subTypeDisplayName(c){ const sub=(c&&c.subscription)||{}; const t=typeById(sub.typeId); if(t) return typeDisplayName(t); return sub.typeName||''; }
function isValidMdPhone(phone){ const digits=(phone||'').replace(/\D/g,''); return /^0[67]\d{7}$/.test(digits) || /^373[67]\d{7}$/.test(digits); }
function pastelForClient(c){
  const sub=(c&&c.subscription)||{};
  if(sub.unlimited) return null;
  if(sub.tier==='exclusiv') return EXCLUSIV_ACCENT;
  if(sub.tier==='gold') return null;
  const sorted=state.types.slice().sort((a,b)=>(a.price||0)-(b.price||0));
  const idx=sorted.findIndex(x=>x.id===sub.typeId);
  return idx>=0 ? PLAN_PASTELS[idx % PLAN_PASTELS.length] : null;
}

function subStatus(c){
  const sub=c.subscription;
  if(c.paused) return {label:tr('stSuspended'), tone:'warning'};
  if(!sub || !sub.validTo) return {label:tr('stNoSub'), tone:'muted'};
  const dl=daysLeft(sub.validTo);
  const due=(sub.totalDue||0)-(sub.totalPaid||0);
  if(dl<0) return {label:tr('stExpired'), tone:'danger'};
  if(due>0.5) return {label:tr('stUnpaid'), tone:'danger'};
  const warn = (state.settings && state.settings.warnDays!=null) ? state.settings.warnDays : 5;
  if(dl<=warn) return {label: dl===0?tr('stExpiresToday'):expiresInLabel(dl), tone:'warning'};
  return {label:tr('stValid'), tone:'success'};
}
function toneForResult(r){
  if(r==='permis') return 'success';
  if(r==='necunoscut'||r==='neachitat'||r==='expirat') return 'danger';
  if(r==='suspendat'||r==='orar'||r==='orar_sala'||r==='inchis'||r==='prea_devreme') return 'warning';
  if(r==='neinceput') return 'info';
  return 'muted';
}
function inTimeWindow(date, fromStr, toStr){
  const [fh,fm]=fromStr.split(':').map(Number); const [th,tm]=toStr.split(':').map(Number);
  const mins=date.getHours()*60+date.getMinutes(); const f=fh*60+fm, t=th*60+tm;
  if(f<=t) return mins>=f && mins<=t; return mins>=f || mins<=t;
}
function gymScheduleFor(date, s){ s=s||DEFAULT_SETTINGS; const day=date.getDay(); const openDays=s.openDays||DEFAULT_SETTINGS.openDays; const closedToday = (openDays && openDays[day]===false) || (s.closedDates||[]).includes(todayStr()); const isSaturday = day===6; const from = (isSaturday && s.saturdayDifferent) ? (s.saturdayOpenHour||DEFAULT_SETTINGS.saturdayOpenHour) : (s.openHour||DEFAULT_SETTINGS.openHour); const to = (isSaturday && s.saturdayDifferent) ? (s.saturdayCloseHour||DEFAULT_SETTINGS.saturdayCloseHour) : (s.closeHour||DEFAULT_SETTINGS.closeHour); return {closedToday, from, to}; } function generateUniqueCode(){
  for(let i=0;i<25;i++){ const n=Math.floor(1000+Math.random()*9000); const code='GYM-'+n; if(!state.clients.some(c=>c.code===code)) return code; }
  return 'GYM-'+String(Date.now()).slice(-4);
}
function normalizeMemberCode(input){
  let v=(input||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(v.slice(0,3)==='GYM') v=v.slice(3);
  const digits=v.replace(/[^0-9]/g,'');
  return digits? ('GYM-'+digits) : '';
}
function formatGymCode(v){ v=(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.slice(0,3)==='GYM') return 'GYM-'+v.slice(3); return v; } async function verifyAccess(rawCode){
  if(!db) return;
  const code=normalizeMemberCode(rawCode);
  if(!code) return;
  const client=state.clients.find(c=>c.code===code);
  const now=new Date();
  const gs=gymScheduleFor(now, state.settings); let result='permis', message='Acces permis';
  if(!client){ result='necunoscut'; message='Cod QR necunoscut'; }
  else if(client.paused){ result='suspendat'; message='Acces suspendat'; } else if(gs.closedToday){ result='inchis'; message='Sala este închisă în această zi.'; } else if(!inTimeWindow(now, gs.from, gs.to)){ result='orar_sala'; message='Sala este deschisă între '+gs.from+' și '+gs.to+'.'; }
  else{
    const sub=client.subscription||{};
    if(sub.validFrom && sub.validFrom>todayStr()){ result='neinceput'; message='Abonamentul începe pe '+fmtDate(sub.validFrom); }
    else{
      const dl = sub.validTo? daysLeft(sub.validTo) : null;
      const due=(sub.totalDue||0)-(sub.totalPaid||0);
      if(dl!==null && dl<0){ result='expirat'; message='Abonament expirat'; }
      else if(due>0.5){ result='neachitat'; message='Abonament neachitat'; }
      else{
        const type=typeById(sub.typeId);
        const af=(type&&type.accessFrom)||sub.accessFrom, at=(type&&type.accessTo)||sub.accessTo;
        if(af && at && !inTimeWindow(now,af,at)){ result='orar'; message='Acces permis doar între '+af+' și '+at; }
        else{
          const mm=(state.settings&&state.settings.minMinutesBetweenEntries)||0;
          if(mm && client.lastEntryAt){
            const diffMin=(now-new Date(client.lastEntryAt))/60000;
            if(diffMin<mm){ result='prea_devreme'; message='Prea devreme — mai așteaptă '+Math.ceil(mm-diffMin)+' min'; }
          }
        }
      }
    }
  }
  try{
    await colLog().add({clientId: client?client.id:null, clientName: client?client.name:'Cod necunoscut', code, timestamp: now.toISOString(), result, message});
    if(client){
      const recentEntries=[{t:now.toISOString(), r:result}].concat(client.recentEntries||[]).slice(0,20);
      await colClients().doc(client.id).update(Object.assign({recentEntries}, result==='permis'? {lastEntryAt:now.toISOString()} : {}));
    }
  }catch(e){}
  state.lastResult={client, result, message, code}; state.scanInput='';
  scheduleRender();
}

async function notifyClientByEmail(client, kind, silent){
  try{
    if(!client || !client.id || !client.email || !emailConfigured()) return;
    const user=firebase.auth().currentUser; if(!user || user.isAnonymous) return;
    const idToken=await user.getIdToken();
    // text/plain avoids a CORS preflight, which Apps Script web apps don't answer.
    const res=await fetch(EMAIL_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ idToken, clientId:client.id, kind:kind||'activated' }) });
    const data=await res.json();
    if(silent) return;
    if(data.ok) showToast(ra('Email trimis clientului: ')+client.email);
    else showToast(ra('Emailul către client nu a fost trimis')+' ('+data.error+').');
  }catch(e){ if(!silent) showToast(ra('Emailul către client nu a fost trimis')+' (network).'); }

function renderReception(){

  const expSoon=state.clients.filter(c=>{ const s=subStatus(c); return s.tone==='warning' && !c.paused; });
  expSoon.sort((a,b)=>((daysLeft(a.subscription&&a.subscription.validTo))||999)-((daysLeft(b.subscription&&b.subscription.validTo))||999));
  const today=todayStr();
  const todayEntries=state.log.filter(l=>l.result==='permis' && (l.timestamp||'').slice(0,10)===today).length;
  const todayRevenue=state.payments.filter(p=>(p.date||'').slice(0,10)===today).reduce((s,p)=>s+Number(p.amount||0),0);
  const stat=(label,num,ic)=>'<div class="card stat-card"><div class="stat-top"><div class="stat-label">'+label+'</div><div class="stat-ic">'+icon(ic,'icon-sm')+'</div></div><div class="stat-num mono">'+num+'</div></div>';

async function sendExpiryReminders(){
  if(!emailConfigured()){ showToast(ra('Trimiterea emailurilor nu este configurată încă.')); return; }

async function saveNewClient(){
  const f=state.form;
  if(!f.name||!f.name.trim()){ state.formErr=ra('Introdu numele clientului.'); scheduleRender(); return; }
  if(!f.phone||!f.phone.trim()){ state.formErr=ra('Introdu numărul de telefon.'); scheduleRender(); return; }
  if(!isValidMdPhone(f.phone)){ state.formErr=ra('Numărul de telefon nu este valid (format: 0XX XXX XXX).'); scheduleRender(); return; }
  if(!f.birthYear){ state.formErr=ra('Completează data nașterii.'); scheduleRender(); return; }
  if(!f.typeId){ state.formErr=ra('Alege un abonament.'); scheduleRender(); return; }
  if(!f.method){ state.formErr=ra('Alege metoda de plată.'); scheduleRender(); return; }
  const t=typeById(f.typeId);
  if(t && t.tier==='exclusiv' && state.adminRole!=='owner'){ state.formErr=ra('Doar proprietarul poate atribui abonamente Exclusiv.'); scheduleRender(); return; }
  const code=generateUniqueCode();
  const paid=f.paidFull? Number(f.price||0) : Number(f.amountPaid||0);
  const doc={ name:f.name.trim(), phone:(f.phone||'').trim(), email:(f.email||'').trim(), birthDate:combineBirthDate(f.birthYear), code, createdAt:new Date().toISOString(), notes:f.notes||'', paused:false, lastEntryAt:null,
    subscription:{ typeId:f.typeId, typeName:t?t.name:'', tier:t?t.tier:'fitness', unlimited:t?!!t.unlimited:false, accessFrom:t?t.accessFrom:null, accessTo:t?t.accessTo:null,
      validFrom:f.validFrom, validTo:f.validTo, price:Number(f.price||0), currency:f.currency, totalDue:Number(f.price||0), totalPaid:paid, paymentMethod:f.method } };
  try{
    const ref=await colClients().add(doc);
    if(!state.clients.find(x=>x.id===ref.id)){ state.clients=state.clients.concat([Object.assign({id:ref.id}, doc)]); }
    if(paid>0){ await colPay().add({clientId:ref.id, clientName:doc.name, amount:paid, currency:f.currency, method:f.method, date:new Date().toISOString(), note:'Abonament nou'}); }
    await logMod('Client nou înregistrat', doc.name+' · '+doc.subscription.typeName);
    showToast((state.lang==='ru'?'Клиент создан: ':'Client creat: ')+code);
    if(paid>=Number(f.price||0)-0.5){ notifyClientByEmail(Object.assign({id:ref.id}, doc)); }
    openModal('clientDetail', {id:ref.id});
  }catch(e){ state.formErr=ra('A apărut o eroare. Încearcă din nou.'); scheduleRender(); }
}

function buildCardCanvas(c){
  const sub=c.subscription||{};
  const accent=pastelForClient(c) || '#C9A24B';
  const gymName=((state.settings&&state.settings.gymName)||'Fitness Park').toUpperCase();
  const W=560, H=1000;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  if(!ctx) return null;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=accent; ctx.lineWidth=6; roundRectPath(ctx,14,14,W-28,H-28,26); ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#171A24'; ctx.font='700 21px Sora, sans-serif'; ctx.fillText(gymName, W/2, 90);
  ctx.fillStyle='#8A8EA3'; ctx.font='700 13px "Public Sans", sans-serif'; ctx.fillText(state.lang==='ru'?'КАРТА УЧАСТНИКА':'CARD DE MEMBRU', W/2, 116);
  ctx.fillStyle='#171A24'; ctx.font='700 30px Sora, sans-serif'; ctx.fillText(c.name, W/2, 172);
  const qrEl=document.querySelector('.member-card [data-qr="'+(window.CSS&&CSS.escape?CSS.escape(c.code):c.code)+'"]');
  const qrSrc = qrEl ? (qrEl.querySelector('canvas')||qrEl.querySelector('img')) : null;
  const qrSize=240, qrX=(W-qrSize)/2, qrY=205;
  ctx.fillStyle='#fff'; ctx.strokeStyle='#E3E5F0'; ctx.lineWidth=1; roundRectPath(ctx,qrX-14,qrY-14,qrSize+28,qrSize+28,14); ctx.fill(); ctx.stroke();
  if(qrSrc){ try{ ctx.drawImage(qrSrc, qrX, qrY, qrSize, qrSize); }catch(e){} }
  ctx.fillStyle='#171A24'; ctx.font='600 18px "Public Sans", sans-serif'; ctx.fillText(subTypeDisplayName(c)||'—', W/2, qrY+qrSize+55);
  ctx.fillStyle='#666C82'; ctx.font='400 14px "Public Sans", sans-serif'; ctx.fillText(sub.unlimited? ('∞ '+(state.lang==='ru'?'Безлимит':'Nelimitat')) : (fmtDate(sub.validFrom)+' — '+fmtDate(sub.validTo)), W/2, qrY+qrSize+80);
  ctx.fillStyle='#8A8EA3'; ctx.font='700 12px "Public Sans", sans-serif'; ctx.fillText(state.lang==='ru'?'КОД УЧАСТНИКА · РУЧНАЯ ПРОВЕРКА':'COD MEMBRU · VERIFICARE MANUALĂ', W/2, qrY+qrSize+120);
  ctx.fillStyle='#171A24'; ctx.font='700 24px "JetBrains Mono", monospace'; ctx.fillText(c.code, W/2, qrY+qrSize+154);
  ctx.fillStyle='#9599AC'; ctx.font='400 13px "Public Sans", sans-serif'; ctx.fillText(tr('presentQr'), W/2, H-40);
  return cv;
}

async function changePassword(){
  const f=state.pwForm||{};
  const user=firebase.auth().currentUser;
  if(!user || !user.email){ state.pwErr=ra('Nu ești autentificat cu un cont de email.'); scheduleRender(); return; }
  if(!f.current){ state.pwErr=ra('Introdu parola curentă.'); scheduleRender(); return; }
  if(!f.next||f.next.length<6){ state.pwErr=ra('Parola nouă trebuie să aibă minim 6 caractere.'); scheduleRender(); return; }
  if(f.next!==f.confirm){ state.pwErr=ra('Parolele nu coincid.'); scheduleRender(); return; }
  try{
    const cred=firebase.auth.EmailAuthProvider.credential(user.email, f.current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(f.next);
  }catch(e){
    if(e && (e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')){ state.pwErr=ra('Parola curentă este greșită.'); }
    else if(e && e.code==='auth/password-does-not-meet-requirements'){ state.pwErr=ra('Parola nouă nu îndeplinește cerințele de securitate (adaugă litere mari, mici și cifre).'); }
    else if(e && e.code==='auth/too-many-requests'){ state.pwErr=ra('Prea multe încercări. Așteaptă puțin și mai încearcă o dată.'); }
    else if(e && e.code==='auth/requires-recent-login'){ state.pwErr=ra('Sesiunea a expirat. Ieși din cont și intră din nou, apoi încearcă.'); }
    else{ state.pwErr=ra('Eroare la schimbarea parolei')+(e&&e.code?(' ('+e.code+')'):(e&&e.message?(': '+e.message):''))+'.'; }
    scheduleRender();
    return;
  }
  state.pwForm={}; state.pwErr=''; showToast(ra('Parola a fost schimbată.'));
  scheduleRender();
  try{ await logMod('Parolă schimbată', user.email); }catch(e){}
}
async function addTeam(){
  const f=state.teamForm||{};
  const email=(f.email||'').trim().toLowerCase();
  if(!email||!email.includes('@')){ showToast(ra('Introdu un e-mail valid.')); return; }
  const pass=f.password||'';
  if(!pass||pass.length<6){ showToast(ra('Parola inițială trebuie să aibă minim 6 caractere.')); return; }
  const existing=((state.settings&&state.settings.team)||[]); const hasOwner=existing.some(m=>m.role==='owner'); if(!(state.adminRole==='owner'||(!hasOwner&&state.adminRole==='admin'))){ showToast(ra('Doar proprietarul poate gestiona echipa.')); return; }
  if(existing.some(m=>(m.email||'').toLowerCase()===email)){ showToast(ra('Acest email are deja acces.')); return; }
  let secondaryApp=null; let reused=false;
  try{
    secondaryApp=firebase.initializeApp(firebase.app().options, 'teamAdd'+Date.now());
    await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
    await secondaryApp.delete();
  }catch(e){
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(_e){} }
    if(e && e.code==='auth/email-already-in-use'){ reused=true; }
    else if(e && e.code==='auth/weak-password'){ showToast(ra('Parola trebuie să aibă minim 6 caractere.')); return; }
    else{ showToast(ra('Eroare la crearea contului.')); return; }
  }
  const team=existing.slice(); team.push({email, role:f.role||'admin'});
  try{ await saveSettingsDoc({team}); state.teamForm={}; await logMod('Acces echipă adăugat', email); showToast(reused? ra('Acces redat — acest email avea deja un cont Firebase; colegul intră cu parola lui veche, nu cu cea introdusă acum.') : ra('Cont creat — colegul poate intra cu acest email și parola primită.')); }
  catch(e){ showToast(ra('Eroare la salvarea accesului.')); }
  scheduleRender();
}

}

/* ============ TOP-LEVEL RENDER ============ */
function render(){
  const root=document.getElementById('app');
  if(!root) return;
  const active=document.activeElement;
  let selKey=null, selStart=null, selEnd=null;
  if(active && root.contains(active)){
    const bindPath = active.getAttribute && active.getAttribute('data-bind');
    if(bindPath) selKey='[data-bind="'+bindPath.replace(/"/g,'\\"')+'"]';
    else if(active.id) selKey='#'+active.id;
    if('selectionStart' in active){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  }
  let html='';
  if(!state.ready){ html=renderLoading(); }
  else if(state.screen==='landing'){ html=renderLanding(); }
  else if(state.screen==='admin-gate'){ html=renderAdminGate(); }
  else if(state.screen==='client-gate'){ html=renderClientGate(); }
  else if(state.screen==='buy-gate'){ html=renderBuyGate(); }
  else if(state.screen==='admin' && state.adminUnlocked){ html=renderAdminShell(); }
  else if(state.screen==='client' && state.clientSession){ html=renderClientPortal(); }
  else{ state.screen='landing'; html=renderLanding(); }
  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
  if(state.confirmDialog) html += renderConfirmDialog();
  root.innerHTML=html;
  bindEvents(root);
  afterRenderHooks();
  if(selKey){ try{ const el=root.querySelector(selKey); if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } } }catch(e){} }
}
function afterRenderHooks(){
  document.querySelectorAll('[data-qr]').forEach(el=>{
    const text=el.getAttribute('data-qr'); el.innerHTML='';
    try{ new QRCode(el, {text, width:168, height:168, correctLevel:QRCode.CorrectLevel.M, colorDark:'#12131C', colorLight:'#ffffff'}); }catch(e){}
  });
  if(state.cameraOn && cameraStream){ const video=document.getElementById('scanVideo'); if(video && !video.srcObject) video.srcObject=cameraStream; }
}

/* ============ EVENTS ============ */
function bindEvents(root){
  root.querySelectorAll('[data-action]').forEach(el=>{ el.addEventListener('click', ()=>onAction(el)); }); root.querySelectorAll('[data-gymcode]').forEach(el=>{ el.addEventListener('input', ()=>{ const f=formatGymCode(el.value); if(f!==el.value) el.value=f; }); }); root.querySelectorAll('[data-numeric]').forEach(el=>{ el.addEventListener('input', ()=>{ let f=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,''); const firstDot=f.indexOf('.'); if(firstDot!==-1) f=f.slice(0,firstDot+1)+f.slice(firstDot+1).replace(/\./g,''); if(f!==el.value) el.value=f; }); }); root.querySelectorAll('input[type="tel"]').forEach(el=>{ el.addEventListener('input', ()=>{ const f=el.value.replace(/\D/g,'').slice(0,11); if(f!==el.value) el.value=f; }); }); root.querySelectorAll('[data-photo-upload]').forEach(el=>{ el.addEventListener('change', ()=>{ const id=el.getAttribute('data-photo-upload'); const file=el.files&&el.files[0]; if(file) uploadClientPhoto(id, file); }); });
  root.querySelectorAll('.modal').forEach(m=>m.addEventListener('click', e=>e.stopPropagation()));
  root.querySelectorAll('.overlay, .mobile-nav-backdrop').forEach(ov=>{ let downSelf=false; ov.addEventListener('mousedown', e=>{ downSelf = e.target===ov; }); ov.addEventListener('click', e=>{ if(e.target===ov && downSelf){ if(ov.hasAttribute('data-confirm-overlay')){ state.confirmDialog=null; scheduleRender(); } else if(ov.classList.contains('overlay')) closeModal(); else { state.mobileNavOpen=false; scheduleRender(); } } }); });
  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key=el.getAttribute('data-nav');
      if(key==='reports' && state.adminRole!=='owner') return;
      if(key==='settings' && !state.settingsDraft) state.settingsDraft=draftFromSettings(state.settings);
      state.adminSection=key; state.modal=null; state.mobileNavOpen=false; scheduleRender();
    });
  });
  root.querySelectorAll('[data-bind]').forEach(el=>{
    const path=el.getAttribute('data-bind');
    const ev=(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='time')?'change':'input';
    el.addEventListener(ev, ()=>{
      const val = el.type==='checkbox'? el.checked : el.value;
      setPath(state, path, val);
      if(path==='form.typeId'){ if(state.modal&&state.modal.type==='newClient') applyTypeDefaultsNew(); if(state.modal&&(state.modal.type==='renew'||state.modal.type==='editSub')) applyTypeDefaultsRenew(); }
      scheduleRender();
    });
  });
  root.querySelectorAll('[data-enter]').forEach(el=>{
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const a=el.getAttribute('data-enter'); const btn=root.querySelector('[data-action="'+a+'"]'); if(btn) btn.click(); } });
  });
}
function onAction(el){
  const a=el.getAttribute('data-action'); const id=el.getAttribute('data-id');
  switch(a){
    case 'go-admin': state.formErr=''; state.screen='admin-gate'; break;
    case 'go-client': state.formErr=''; state.screen='client-gate'; stopCamera(); break;
    case 'back-landing': state.screen='landing'; state.formErr=''; stopCamera(); break;
    case 'admin-login-submit': adminLoginSubmit(); return;
    case 'admin-setup-submit': adminSetupSubmit(); return;
    case 'client-login-submit': clientLoginSubmit(); return;
    case 'admin-lock': state.adminUnlocked=false; state.adminRole=null; state.screen='admin-gate'; state.modal=null; lockAdminSession(); break;
    case 'client-logout': state.clientSession=null; state.screen='landing'; try{ localStorage.removeItem('fp_client_code'); }catch(e){} break;
    case 'open-new-client': openNewClient(el.getAttribute('data-type')||null); return;
    case 'open-client-detail': openModal('clientDetail', {id}); return;
    case 'open-renew': openRenew(id); return; case 'open-edit-sub': openEditSub(id); return;
    case 'open-edit-client': openEditClient(id); return;
    case 'delete-client-photo': deleteClientPhoto(id); return;
    case 'toggle-pause-client': togglePauseClient(id); return;
    case 'delete-client': askConfirm(ra('Sigur ștergi acest client? Acțiunea nu poate fi anulată.'), ()=>deleteClient(id), {danger:true}); return;
    case 'print-card': printCard(id); return; case 'replace-lost-card': replaceLostCard(id); return;
    case 'request-new-card': requestNewCard(id); return; case 'approve-card-request': approveCardRequest(id); return; case 'reject-card-request': rejectCardRequest(id); return; case 'request-trainer': requestTrainer(id); return; case 'request-printed-card': requestPrintedCard(id); return;
    case 'go-buy': state.formErr=''; state.buySubmitted=false; state.buyForm={typeId:(state.types.find(t=>t.active!==false && t.tier!=='exclusiv')||{}).id||''}; state.screen='buy-gate'; break; case 'pick-buy-plan': state.buyForm.typeId=id; break; case 'pick-plan-type': state.form.typeId=id; if(state.modal&&state.modal.type==='newClient') applyTypeDefaultsNew(); if(state.modal&&(state.modal.type==='renew'||state.modal.type==='editSub')) applyTypeDefaultsRenew(); break; case 'submit-buy-request': submitBuyRequest(); return; case 'convert-buy-request': convertBuyRequest(id); return; case 'reject-buy-request': rejectBuyRequest(id); return;
    case 'download-card': downloadCardForPhone(id); return;
    case 'share-card': shareCard(id); return;
    case 'close-modal': closeModal(); return;
    case 'save-new-client': saveNewClient(); return;
    case 'save-renew': saveRenew(); return; case 'save-edit-sub': saveEditSub(); return;
    case 'save-edit-client': saveEditClient(); return;
    case 'open-new-type': openNewType(); return;
    case 'open-edit-type': openEditType(id); return;
    case 'save-type': saveType(); return;
    case 'delete-type': askConfirm(ra('Ștergi acest tip de abonament din catalog?'), ()=>deleteType(id), {danger:true}); return;
    case 'verify-scan': { const v=document.getElementById('scanInput'); verifyAccess(v?v.value:''); return; }
    case 'toggle-camera-reception': toggleCamera('scanInput'); return;
    case 'toggle-camera-client': toggleCamera('clientCode'); return;
    case 'export-csv': exportCSV(el.getAttribute('data-kind')); return; case 'clear-payments': askConfirm(ra('Sigur ștergi tot istoricul încasărilor? Acțiunea nu poate fi anulată.'), clearPayments, {danger:true}); return; case 'clear-modlog': askConfirm(ra('Sigur ștergi tot istoricul modificărilor? Acțiunea nu poate fi anulată.'), clearModLog, {danger:true}); return; case 'clear-accesslog': askConfirm(ra('Sigur ștergi tot istoricul accesului? Acțiunea nu poate fi anulată.'), clearAccessLog, {danger:true}); return;
    case 'save-settings-general': saveSettingsGeneral(); return;
    case 'save-settings-name': saveSettingsName(); return;
    case 'save-settings-news': saveSettingsNews(); return;
    case 'change-password': changePassword(); return;
    case 'add-team': addTeam(); return; case 'clear-all-clients': clearAllClients(); return;
    case 'remove-team': removeTeam(Number(el.getAttribute('data-idx'))); return;
    case 'toggle-mobile-nav': state.mobileNavOpen=!state.mobileNavOpen; break;
    case 'client-tab': state.clientTab=el.getAttribute('data-tab'); break;
    case 'toggle-theme': { const cur=localStorage.getItem('fp_theme')|| (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const next=cur==='dark'?'light':'dark'; try{ localStorage.setItem('fp_theme', next); }catch(e){} document.documentElement.setAttribute('data-theme', next); break; }
    case 'toggle-lang': { const next=(state.lang==='ru')?'ro':'ru'; state.lang=next; try{ localStorage.setItem('fp_lang', next); }catch(e){} break; }
    case 'admin-forgot-password': adminForgotPassword(); return;
    case 'resolve-request': resolveRequest(id); return;
    case 'send-expiry-reminders': sendExpiryReminders(); return;
    case 'confirm-yes': { const cd=state.confirmDialog; state.confirmDialog=null; if(cd&&cd.onYes) cd.onYes(); scheduleRender(); return; }
    case 'confirm-no': state.confirmDialog=null; break;
  }
  scheduleRender();
}
async function adminLoginSubmit(){
  const ve=document.getElementById('adminEmail'), vp=document.getElementById('adminPass');
  const email=(ve?ve.value:'').trim().toLowerCase(); const pass=vp?vp.value:'';
  if(!email||!pass){ state.formErr=ra('Introdu email și parolă.'); scheduleRender(); return; }
  state.formErr='';
  try{ await firebase.auth().signInWithEmailAndPassword(email, pass); }
  catch(e){ state.formErr=ra('Email sau parolă greșită.'); scheduleRender(); return; }
  const team=(state.settings&&state.settings.team)||[];
  const member=team.find(m=>(m.email||'').toLowerCase()===email);
  if(!member){
    try{ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); }catch(e){}
    state.formErr=ra('Acest cont nu (mai) are acces la panou.');
    scheduleRender(); return;
  }
  state.adminUnlocked=true; state.adminRole=member.role||'admin'; state.screen='admin'; state.formErr=''; state.adminSection='reception';
  subscribeStaff();
  scheduleRender();
}
async function adminForgotPassword(){
  const ve=document.getElementById('adminEmail');
  const email=(ve?ve.value:'').trim().toLowerCase();
  if(!email||!email.includes('@')){ state.formErr=ra('Scrie emailul contului tău mai sus, apoi apasă din nou „Am uitat parola".'); scheduleRender(); return; }
  state.formErr='';
  try{ await firebase.auth().sendPasswordResetEmail(email); }catch(e){}
  showToast(ra('Dacă acest cont există, ți-am trimis un email cu link de resetare a parolei.'));
}
async function adminSetupSubmit(){
  const ve=document.getElementById('setupEmail'), v1=document.getElementById('setupPass1'), v2=document.getElementById('setupPass2');
  const email=(ve?ve.value:'').trim().toLowerCase(); const p1=v1?v1.value:'', p2=v2?v2.value:'';
  if(!email||!email.includes('@')){ state.formErr=ra('Introdu un email valid.'); scheduleRender(); return; }
  if(!p1||p1.length<6){ state.formErr=ra('Parola trebuie să aibă minim 6 caractere.'); scheduleRender(); return; }
  if(p1!==p2){ state.formErr=ra('Parolele nu coincid.'); scheduleRender(); return; }
  try{
    await firebase.auth().createUserWithEmailAndPassword(email, p1);
    await saveSettingsDoc({team:[{email, role:'owner'}]});
    state.adminUnlocked=true; state.adminRole='owner'; state.screen='admin'; state.formErr=''; state.adminSection='reception';
    subscribeStaff();
    showToast(ra('Panoul de administrare e gata.'));
  }catch(e){
    if(e && e.code==='auth/email-already-in-use'){ state.formErr=ra('Există deja un cont cu acest email.'); }
    else if(e && e.code==='auth/weak-password'){ state.formErr=ra('Parola trebuie să aibă minim 6 caractere.'); }
    else{ state.formErr=ra('Eroare la salvare. Încearcă din nou.'); }
  }
  scheduleRender();
}
function lockAdminSession(){ unsubscribeStaff(); try{ firebase.auth().signOut().then(()=>firebase.auth().signInAnonymously()).catch(()=>{}); }catch(e){} }
function clientLoginSubmit(){
  const v=document.getElementById('clientCode'); const code=normalizeMemberCode(v?v.value:'');
  if(!code){ state.formErr=tr('errEnterCode'); scheduleRender(); return; }
  const c=state.clients.find(x=>x.code===code);
  if(!c){ state.formErr=tr('errCodeNotFound'); scheduleRender(); return; }
  state.clientSession=c.id; state.screen='client'; state.formErr=''; state.clientTab='sub'; stopCamera();
  try{ localStorage.setItem('fp_client_code', code); localStorage.removeItem('fp_pending_phone'); }catch(e){}
  scheduleRender();
}

/* ============ CAMERA SCANNING ============ */
async function toggleCamera(targetInputId){
  if(state.cameraOn){ stopCamera(); scheduleRender(); return; }
  state.cameraOn=true; state.cameraTarget=targetInputId; scheduleRender();
  try{ cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ state.cameraOn=false; showToast(ra('Camera nu este disponibilă aici. Folosește codul manual.')); scheduleRender(); return; }
  setTimeout(()=>{
    const video=document.getElementById('scanVideo');
    if(!video){ stopCamera(); return; }
    video.srcObject=cameraStream;
    const canvas=document.getElementById('scanCanvas'); const ctx=canvas.getContext('2d');
    function tick(){
      if(!state.cameraOn) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth||320; canvas.height=video.videoHeight||240;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const res = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
        if(res && res.data){
          const code=res.data.trim().toUpperCase();
          const target=state.cameraTarget; stopCamera();
          if(target==='scanInput'){ verifyAccess(code); }
          else{
            const c=state.clients.find(x=>x.code===code);
            if(c){ state.clientSession=c.id; state.screen='client'; state.clientTab='sub'; state.formErr=''; }
            else{ state.formErr=tr('errCodeNotFound'); }
            scheduleRender();
          }
          return;
        }
      }
      cameraRAF=requestAnimationFrame(tick);
    }
    cameraRAF=requestAnimationFrame(tick);
  }, 30);
}
function stopCamera(){
  state.cameraOn=false;
  if(cameraRAF){ cancelAnimationFrame(cameraRAF); cameraRAF=null; }
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
}

/* ============ BOOT ============ */
init();
</script>
